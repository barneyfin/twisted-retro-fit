<!-- @dsCard group="Plaque" height=200 width=640 subtitle="Primary with its diamond, primary, secondary; the last pair shows keyboard focus" -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Button</title>
<style>
body{margin:0;background:var(--ink)}
.stage{position:relative;overflow:hidden;background:var(--ink)}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{margin:0;padding:8px 2px 6px;font:500 13px/16px var(--font-text);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}

</style>
</head>
<body>
<div class="stage lb-ui " style="width:640px;height:200px"><div style="position:absolute;left:36px;top:30px;width:568px"><div class="lb-plaque"><div class="lb-face" style="gap:16px"><div class="lb-btns"><button class="lb-btn is-primary has-diamond" type="button">Play again</button><button class="lb-btn" type="button">Menu</button></div><div class="lb-btns"><button class="lb-btn is-primary" type="button" style="box-shadow:inset 0 0 0 2px var(--on-brass)">Done</button><button class="lb-btn" type="button" style="box-shadow:inset 0 0 0 2px var(--focus)">High scores</button></div></div></div></div></div>
<script>/* static preview */</script>
</body>
</html>
