<!-- @dsCard group="Plaque" height=230 width=640 subtitle="In a row (computer) and two by two (phone)" -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Segments</title>
<style>
body{margin:0;background:var(--ink)}
.stage{position:relative;overflow:hidden;background:var(--ink)}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{margin:0;padding:8px 2px 6px;font:500 13px/16px var(--font-text);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}

</style>
</head>
<body>
<div class="stage lb-ui " style="width:640px;height:230px"><div style="position:absolute;left:36px;top:24px;width:568px"><div class="lb-plaque"><div class="lb-face" style="gap:18px"><div class="lb-segments" role="group" aria-label="Picture"><button type="button" aria-pressed="true">Automatic</button><button type="button" aria-pressed="false">Best</button><button type="button" aria-pressed="false">Faster</button><button type="button" aria-pressed="false">Fastest</button></div><div class="lb-segments is-grid" role="group" aria-label="Picture, phone" style="width:300px"><button type="button" aria-pressed="false">Automatic</button><button type="button" aria-pressed="true">Best</button><button type="button" aria-pressed="false">Faster</button><button type="button" aria-pressed="false">Fastest</button></div></div></div></div></div>
<script>document.querySelectorAll('.lb-segments').forEach(g=>g.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{g.querySelectorAll('button').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));})));</script>
</body>
</html>
