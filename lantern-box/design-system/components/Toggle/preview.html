<!-- @dsCard group="Plaque" height=210 width=640 subtitle="On and Off" -->
<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Toggle</title>
<style>
body{margin:0;background:var(--ink)}
.stage{position:relative;overflow:hidden;background:var(--ink)}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{margin:0;padding:8px 2px 6px;font:500 13px/16px var(--font-text);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}

</style>
</head>
<body>
<div class="stage lb-ui " style="width:640px;height:210px"><div style="position:absolute;left:36px;top:26px;width:568px"><div class="lb-plaque"><div class="lb-face" style="gap:14px"><div class="lb-setting is-first"><div class="lb-setting-text"><span class="lb-setting-name" id="tg1">Effects</span><p class="lb-note">Glow round lights, eyes and splashes.</p></div><button class="lb-toggle" type="button" aria-pressed="true" aria-labelledby="tg1">On</button></div><div class="lb-setting"><div class="lb-setting-text"><span class="lb-setting-name" id="tg2">Reduce motion</span><p class="lb-note">Flatter scenery, slower rain, no shaking.</p></div><button class="lb-toggle" type="button" aria-pressed="false" aria-labelledby="tg2">Off</button></div></div></div></div></div>
<script>document.querySelectorAll('.lb-toggle').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.textContent=on?'On':'Off';}));</script>
</body>
</html>
