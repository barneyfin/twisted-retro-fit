   The rules are lantern-box/GAMEPLAY-gloam-hallow.md; the look, the moves and the moments are the design system's, drawn by the kit.
   Step 4d-1: moving through the four places: walking, jumping, climbing banks and pieces, walking off edges, rolling, pits that cost a
   life, the checkpoints and the return to them, three lives, the place cards, the soundtrack and each place's background sound.
   Step 4d-2a: the fight with the crawler, the flyer and the mouth-hat: the sword, each monster's way of coming at him, hits, defeats
   and wisps, being hurt, armour, the second of safety, the roll, health running out, and about 40% of the monsters beaten since the
   checkpoint coming back after a life lost.
   Step 4d-2b: the ghoul and the walker, each place's own mix growing place by place, the roll carrying on through a body, and a crowd
   of monsters for the speed check (Testing).
   Step 4d-3: mana, the heal and the fireball (three levels each, from scrolls), not enough mana's fizzle, switching spells, and the
   loot: potions, armour, scrolls and sword upgrades dropped by monsters and picked up by touch, and health potions on pieces and hills.
   Step 4d-4: the four bosses, each in its arena at the place's end: the camera locking, its arrival, name and bar, its three attacks
   and their answers, blows and fireballs, its defeat, 25 wisps and its sure drop; a life lost restarts at its door.
   Step 4d-5: the whole run, Night to the win, checked end to end; a boss's sure drop lands on the way out.
   Design system version 11 (kit 0.9.0, from Barney's second play): one health and one mana potion kept for later, in the HUD's two
   sockets, drunk with a tap, Q or E (kept through a lost life; the line saying how to drink one once per kind each run); the ghoul
   lurches about 30 forward as it swipes, so it outreaches the sword; the Gaping Tree's branch sweeps at head height all the way out.
   Settings has a Testing panel while the game is being tried out (delete `test` below to remove it).
   Step 5d (kit 0.10.0, design system version 12): saved progress, one versioned record through the kit (lb.progress): the stolen
   echo, what has been bought, the spell and belt chosen, the first run, the hints, the furthest place and the day's doubled run;
   wisps are echo on screen, and each defeat's echo sounds louder the more it gives; the run's end in place of game over (the run's
   echo banked, doubled on the day's first Echo Infusion, a near-miss line, the next unlock), with the Echo Shrine's stand-in until
   step 5e builds it; Credits; P pauses and Backspace goes back. */

/* ---------- saved progress (step 5d; design system version 12): one versioned record, read and written only through the kit ----------
   lb.progress is the record; lb.saveProgress() writes it. Nothing about a run in progress is kept: a run always starts at Night. */
const SAVE_VERSION = 1;
const BELTS = ['nightBlue', 'mulberry', 'ash'];   // bought at the Echo Shrine; 'scarf' is the red one he starts in (its token, wanderer-scarf)
function freshRecord() {
  return { echo: 0,                       // the stolen echo
    sockets: { health: 1, mana: 1 },      // potion sockets bought, 1 to 3 each
    bolt: false, acid: false,             // the spells bought
    belts: { nightBlue: false, mulberry: false, ash: false }, hysteria: false,
    spell: 'fire', belt: 'scarf',         // the attack spell chosen and the belt worn
    played: false, hintsHidden: false,    // whether the first run has been played, and whether the hints were hidden
    furthest: -1,                         // the furthest place reached (0 to 3; 4 the win), for "Furthest yet"
    doubled: '' };                        // the day of the last doubled Echo Infusion run (the device's own date)
}
// a record read back: every value checked, so a damaged one goes back to its start rather than breaking the game
function readRecord(old) {
  const r = freshRecord(), whole = (v, a, b, d) => (typeof v === 'number' && isFinite(v) ? Math.max(a, Math.min(b, Math.floor(v))) : d);
  r.echo = whole(old.echo, 0, 1e9, 0);
  const so = old.sockets && typeof old.sockets === 'object' ? old.sockets : {};
  r.sockets = { health: whole(so.health, 1, 3, 1), mana: whole(so.mana, 1, 3, 1) };
  r.bolt = old.bolt === true; r.acid = old.acid === true; r.hysteria = old.hysteria === true;
  const be = old.belts && typeof old.belts === 'object' ? old.belts : {};
  BELTS.forEach((k) => { r.belts[k] = be[k] === true; });
  r.spell = (old.spell === 'bolt' && r.bolt) || (old.spell === 'acid' && r.acid) ? old.spell : 'fire';
  r.belt = BELTS.indexOf(old.belt) >= 0 && r.belts[old.belt] ? old.belt : 'scarf';
  r.played = old.played === true; r.hintsHidden = old.hintsHidden === true;
  r.furthest = whole(old.furthest, -1, PLACES.length, -1);
  r.doubled = typeof old.doubled === 'string' && /^\d{4}-\d\d-\d\d$/.test(old.doubled) ? old.doubled : '';
  return r;
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

const UNLOCKS = [
  { id: 'health2', kind: 'health', name: 'A second health potion', towards: 'a second health potion', price: 25, has: (r) => r.sockets.health >= 2 },
  { id: 'bolt', kind: 'bolt', name: 'Lightning bolt', towards: 'the lightning bolt', price: 75, has: (r) => r.bolt },
  { id: 'nightBlue', kind: 'belt', name: 'Night blue belt', towards: 'the night blue belt', price: 100, has: (r) => r.belts.nightBlue },

];
function nextUnlock(rec) {             // the cheapest thing not yet bought (and buyable: a third socket only after the second)
  return UNLOCKS.find((u) => !u.has(rec) && (!u.needs || UNLOCKS.find((n) => n.id === u.needs).has(rec))) || null;
}
/* A run's echo banked as stolen echo when it ends, whatever happened (the gameplay note's The score): at the run's end and the win
   (ended), and when it is left by Restart or Quit to menu (Barney, 7 November 2026: banked, without the run's end, and it uses up
   neither the day's doubled run nor the first run). Echo still rising from a defeat when the run ends counts. The first Echo Infusion
   run of each day earns double: only what that run earned, never the stored total, never The Bare Reckoning. */
function bankRun(g, lb, ended, bonus) {
  if (g.banked) return g.banked;
  if (g.echoDue > 0) { lb.addWisps(g.echoDue); g.echoDue = 0; }
  const rec = lb.progress, earned = lb.wisps + (bonus || 0), day = today();
  const daily = ended && g.run === 'infusion' && earned > 0 && rec.doubled !== day;
  const stolen = daily ? earned * 2 : earned;
  const b = { was: rec.echo, stolen, daily: daily ? stolen : null, first: ended && !rec.played, furthest: rec.furthest };
  rec.echo += stolen;
  if (daily) rec.doubled = day;
  rec.furthest = Math.max(rec.furthest, g.won ? PLACES.length : g.p);
  if (ended) rec.played = true;
  lb.saveProgress();
  return (g.banked = b);
}
// the run's end (RunEnd): the kit draws it; these are its rules
function runEndInfo(g, lb) {
  const b = bankRun(g, lb, true), rec = lb.progress, boss = g.boss;
  let near = null;
  if (boss && boss.hp > 0 && boss.name && boss.st !== 'wait' && boss.st !== 'defeat' && boss.st !== 'done') near = { boss: boss.name, left: boss.hp / boss.max };
  else if (!b.first && g.p > b.furthest) near = { furthest: PLACE_NAMES[g.p] };   // not on the very first run: it has nothing to beat (Barney)
  const u = nextUnlock(rec);
  return { near, daily: b.daily, first: b.first, scored: g.run === 'bare', shrine: { bank: rec.echo },
    next: u ? { kind: u.kind, name: u.name, towards: u.towards, price: u.price, was: b.was, now: b.stolen } : null };
}

    lb.placeCard(PLACES[g.p], () => { lb.fade(0); enterPlace(g, lb); }, () => { g.mode = 'ground'; });
    return g;
  },

  update(g, lb) {
    const dt = 1 / 60;
    g.mt += dt;
    if (g.mode === 'card') { if (g.out) g.x += WALK * dt; return; }            // play stops for the place card; leaving a place he walks on
    if (g.mode === 'over') return;
    if (g.safeT > 0) g.safeT -= dt;
    g.hurtT += dt;
    if (g.atkBuf > 0) g.atkBuf -= dt;
    if (g.castBuf > 0) g.castBuf -= dt;
    g.healT += dt;
    if (lb.input.pressed.attack) g.atkBuf = ATTACK_BUF;   // swings at once on the ground; pressed while busy, as soon as he is free
    if (lb.input.pressed.cast) g.castBuf = CAST_BUF;      // the same for a cast
    if (lb.input.pressed.switch) switchSpell(g, lb);
    if (lb.input.pressed.drinkHealth) drink(g, lb, 'health');   // version 11: a kept potion (a tap on its socket, Q or E)
    if (lb.input.pressed.drinkMana) drink(g, lb, 'mana');
    g.drinkT += dt; fillsUpdate(g, lb, dt);
    if (g.mode !== 'lost' && g.mode !== 'return' && g.mana < 1) { g.mana = Math.min(1, g.mana + MANA_RATE * dt); hudMana(g, lb, false); }
    if (!(g.boss && g.boss.st === 'arrive')) moveUpdate(g, lb, dt);   // play stops while the boss comes in
    bossUpdate(g, lb, dt);
    monstersUpdate(g, lb, dt);
    shotsUpdate(g, lb, dt);
    lootUpdate(g, lb, dt);
    hurtCheck(g, lb);
  },

  draw(ctx, g, lb) {
    const w = lb.world, L = g.L, camX = camAt(g, lb);
    w.begin(ctx, { level: L, camX });
    g.cps.forEach((cp, k) => { g.glass[k] = w.checkpoint(cp.x, { lit: cp.lit === true ? true : cp.lit != null ? lb.time - cp.lit : undefined, from: g.lantern || undefined }); });
    drawLoot(g, lb, w, camX);
    drawBoss(g, lb, w);
    drawMonsters(g, lb, w, camX, false);
    const r = drawWanderer(g, lb, w);
    if (r && r.lantern) { g.lantern = r.lantern; g.chest = r.chest; g.hand = r.hand; }

function camAt(g, lb) {                // following him, and held at the arena's end while a boss is fought (the camera locks)
  if (g.boss && g.boss.lock) return Math.max(0, g.L.length - lb.W);
  return Math.max(0, Math.min(g.L.length - lb.W, g.x - lb.W * 0.32));
}

/* ---------- moving (4d-1) ---------- */
function moveUpdate(g, lb, dt) {
  if (g.mode === 'lost') return lostUpdate(g, lb, dt);
  if (g.mode === 'return') return returnUpdate(g, lb, dt);
  const i = lb.input, dir = (i.right ? 1 : 0) - (i.left ? 1 : 0);
  if (g.mode === 'climb') return climbUpdate(g, lb, dt);
  if (g.mode === 'roll') return rollUpdate(g, lb, dt);
  if (g.mode === 'air') return airUpdate(g, lb, dt, dir, i);
  if (g.mode === 'hurt') return hurtUpdate(g, lb, dt);
  if (g.mode === 'sword') return swordUpdate(g, lb, dt, i);
  if (g.mode === 'cast') return castUpdate(g, lb, dt);
  // on the ground (or a piece's top)
  if (dir) g.facing = dir;
  g.landT += dt;
  const face = faceAhead(g);
  // jump at the foot of a face too tall to jump climbs it instead (Barney's choice: the phone's jump button "just works")
  if (i.pressed.jump) return face && face.h > JUMP_CLIMB && face.h <= CLIMB_MAX ? startClimb(g, lb, face) : jump(g, lb);
  if (i.pressed.roll) return startRoll(g, lb);
  if (g.atkBuf > 0) return startSwing(g, lb);
  if (g.castBuf > 0 && g.spellList.length) return startCast(g, lb);
  if (face && i.climb && face.h >= CLIMB_MIN && face.h <= CLIMB_MAX) return startClimb(g, lb, face);
  if (dir) {
    const r = stepTo(g, g.x + dir * WALK * dt);
    g.walkDist += Math.abs(r.moved);
    if (r.drop) startDrop(g);
  }
  checkpoints(g, lb);
  leavePlace(g, lb);
}

/* ---------- places ---------- */
function loadPlace(g, lb, p, ci) {   // the place's level and its checkpoints; ci: start at its first, second or third checkpoint (Testing)
  g.p = p;
  g.L = lb.world.level(PLACES[p]);
  g.pieces = g.L.pieces();
  g.cps = g.L.checkpoints.map((c, k) => ({ x: c.x, lit: k < ci || (ci > 0 && k === ci) ? true : null }));
  g.lastCp = ci;
  g.x = ci > 0 ? g.cps[ci].x + RETURN_AT : 60;
  g.y = surfaceAt(g, g.x); g.on = pieceUnder(g, g.x, g.y); g.vy = 0; g.facing = 1; g.walkDist = 0;
  spawnMonsters(g, lb);

}
function enterPlace(g, lb) {         // once the place card's black is down: the place's sound and track

  lb.ambient(PLACES[g.p]);
  lb.music(TRACK[PLACES[g.p]]);
}
function leavePlace(g, lb) {         // walking on out of the boss's arena: the next place's card, or after the Mist the win
  if (g.x < g.L.length + 30 || g.out) return;
  if (g.p === PLACES.length - 1) { g.mode = 'over'; g.won = true; bankRun(g, lb, true, g.lives * LIFE_BONUS); lb.win(); return; }   // step 5d: banked
  g.out = true; g.mode = 'card';
  lb.placeCard(PLACES[g.p + 1], () => { lb.fade(0); loadPlace(g, lb, g.p + 1, 0); enterPlace(g, lb); }, () => { g.mode = 'ground'; g.mt = 0; });
}
function checkpoints(g, lb) {        // a checkpoint lights as he passes it, and becomes where he returns
  g.cps.forEach((cp, k) => {
    if (cp.lit == null && g.x >= cp.x - 20) { cp.lit = lb.time; g.lastCp = Math.max(g.lastCp, k); lb.sfx('checkpoint'); }
  });
}

/* ---------- the ground, the banks and the pieces ---------- */
function groundAt(g, x) { return g.L.pit(x) ? Infinity : g.L.ground(x); }
function pieceUnder(g, x, y) { return g.pieces.find((p) => x >= p.x0 && x <= p.x1 && Math.abs(p.y(x) - y) < 2) || null; }
function surfaceAt(g, x) {           // where he stands at x: a piece's top or the ground
  const p = g.pieces.find((q) => x >= q.x0 && x <= q.x1);
  return p ? p.y(x) : g.L.ground(x);
}
function bankRise(g, b) { return g.L.ground(b[0] - 1) - g.L.ground(b[1] + 1); }   // positive: the ground rises going right

function faceAhead(g) {

  const f = g.facing;
  for (const b of g.L.banks) {
    const rise = bankRise(g, b) * f;

    const foot = f > 0 ? b[0] - 3 : b[1] + 3, gap = (foot - g.x) * f;
    if (gap >= -4 && gap <= 8) return { foot, h: g.y - g.L.ground(f > 0 ? b[1] + 1 : b[0] - 1), kind: 'bank' };
  }
  for (const p of g.pieces) {
    const side = f > 0 ? p.x0 : p.x1, foot = side - f * 3, gap = (foot - g.x) * f, top = p.y(side + f);
    if (gap >= -4 && gap <= 8 && g.y - top > STEP_UP) return { foot, h: g.y - top, kind: 'piece', piece: p };

}
// walk along the ground (or a piece's top) towards xn: stops at a bank or a tall piece's side, steps onto a low piece, and says
// whether he walked off an edge, a down-bank or into a pit
function stepTo(g, xn) {
  const x0 = g.x, f = Math.sign(xn - x0) || g.facing;
  if (g.on) {   // on a piece's top
    const p = g.on;
    if (xn >= p.x0 && xn <= p.x1) { g.x = xn; g.y = p.y(xn); return { moved: xn - x0 }; }
    g.x = xn; g.on = null;
    if (g.L.pit(xn) || g.L.ground(xn) - g.y > 3) return { moved: xn - x0, drop: true };
    g.y = g.L.ground(xn); return { moved: xn - x0 };
  }
  for (const b of g.L.banks) {   // a bank rising his way stops him at its foot; one falling away is an edge
    const rise = bankRise(g, b) * f, foot = f > 0 ? b[0] - 3 : b[1] + 3;
    if (rise >= BANK_MIN && (foot - x0) * f >= 0 && (xn - foot) * f > 0) { g.x = foot; return { moved: foot - x0, blocked: true }; }
    if (rise <= -BANK_MIN) { const lip = f > 0 ? b[0] : b[1]; if ((lip - x0) * f >= 0 && (xn - lip) * f > 0) { g.x = xn; return { moved: xn - x0, drop: true }; } }
  }
  for (const p of g.pieces) {    // a piece: its side stops him if tall, or he steps onto it
    const side = f > 0 ? p.x0 : p.x1;
    if ((side - x0) * f >= 0 && (xn - side) * f >= 0) {
      const top = p.y(side + f);
      if (g.y - top > STEP_UP) { const foot = side - f * 3; g.x = (foot - x0) * f > 0 ? foot : x0; return { moved: g.x - x0, blocked: true }; }
      if (top - g.y > 3) { g.x = xn; return { moved: xn - x0, drop: true }; }   // a piece lower than the ground beside it: down onto it
      g.x = xn; g.on = p; g.y = p.y(Math.max(p.x0, Math.min(p.x1, xn))); return { moved: xn - x0 };
    }
  }
  g.x = Math.max(10, xn);
  if (g.L.pit(g.x)) return { moved: g.x - x0, drop: true };
  g.y = g.L.ground(g.x);
  return { moved: g.x - x0 };
}

/* ---------- moves ---------- */
function jump(g, lb) { g.mode = 'air'; g.air = 'jump'; g.airT = 0; g.vy = -JUMP_V; g.on = null; g.mt = 0; lb.sfx('jump'); }
function startDrop(g) { g.mode = 'air'; g.air = 'drop'; g.airT = 0; g.vy = 0; g.on = null; g.mt = 0; }
function airUpdate(g, lb, dt, dir, i) {
  g.airT += dt;
  if (g.air === 'drop' && g.airT < COYOTE && i.pressed.jump) return jump(g, lb);
  if (dir) g.facing = dir;
  // across: stopped by ground or a piece's side above his feet
  if (dir) {
    const xn = g.x + dir * (g.air === 'jump' ? AIR_JUMP : AIR) * dt;
    const wall = groundAt(g, xn) < g.y - 2 || g.pieces.some((p) => xn >= p.x0 && xn <= p.x1 && !(g.x >= p.x0 && g.x <= p.x1) && p.y(xn) < g.y - 2);
    if (!wall) g.x = Math.max(10, xn);
  }
  // down: gravity, then landing on a piece's top or the ground
  const y0 = g.y;
  g.vy = Math.min(FALL_MAX, g.vy + GRAV * dt);
  g.y += g.vy * dt;
  if (g.vy > 0) {
    const p = g.pieces.find((q) => g.x >= q.x0 && g.x <= q.x1 && y0 <= q.y(g.x) + 1 && g.y >= q.y(g.x));
    if (p) return land(g, lb, p.y(g.x), p);
    const gy = groundAt(g, g.x);
    if (gy !== Infinity && g.y >= gy) return land(g, lb, gy, null);
    const pit = g.L.pits.find((q) => g.x > q[0] && g.x < q[1]);
    if (pit && g.y > g.L.ground(g.x) + 20) return startLost(g, lb, 'pit', pit);
  }
}
function land(g, lb, y, p) {
  const hard = g.vy > 300;
  g.y = y; g.on = p; g.vy = 0; g.mode = 'ground'; g.landT = hard ? 0 : 9; g.mt = 0;
  if (hard) lb.sfx('land');

}
function startClimb(g, lb, face) {
  const steps = lb.world.move('climb', 0).steps, end = lb.world.move('climb', steps);
  g.mode = 'climb'; g.mt = 0;
  g.climb = { foot: face.foot, y0: g.y, h: face.h, scale: face.h / (96 * 1.32), steps, endDx: end.dx };
  g.x = face.foot;
}
function climbUpdate(g, lb, dt) {
  const c = g.climb, s = g.mt * lb.world.stepRate;
  if (s < c.steps) return;
  g.x = c.foot + g.facing * c.endDx;   // up: on the top, a little way in
  g.y = surfaceAt(g, g.x); g.on = pieceUnder(g, g.x, g.y); g.mode = 'ground'; g.mt = 0; g.landT = 9;
}
function startRoll(g, lb) { g.mode = 'roll'; g.mt = 0; g.rollX = g.x; g.rollOn = 0; lb.sfx('roll'); }
function rollUpdate(g, lb, dt) {
  const s = Math.min(g.mt, ROLL_T) * lb.world.stepRate, m = lb.world.move('roll', s);
  const r = g.mt < ROLL_T ? stepTo(g, g.rollX + g.facing * m.dx) : stepTo(g, g.x + g.facing * ROLL_ON * dt);
  if (r.drop) return startDrop(g);
  if (r.blocked) { g.rollX = g.x - g.facing * m.dx; g.rollOn = ROLL_ON_T; }   // against a face: he rolls on the spot
  if (g.mt >= ROLL_T) {

    const inside = r.blocked ? null : g.mons.find((q) => alive(q) && MON[q.kind].through && MON[q.kind].ground && overlapsBody(g, q));
    g.rollOn += dt;
    if (!inside || g.rollOn > ROLL_ON_T) { g.mode = 'ground'; g.mt = 0; g.landT = 9; }
  }

}
const ROLL_ON = 130, ROLL_ON_T = 0.4;   // a roll carrying on through a body: lines a second, and for no longer than this
// clear by 10 of its longer side either way (the ghoul reaches 41 in front, 18 behind, and turns to him after its swipe)
function overlapsBody(g, m) { const r = halfW(m) + BODY_W + 10; return Math.abs(m.px - g.x) < r; }

/* ---------- a life lost (a fall into a pit, or health run out) and the return (the design system's timings: play.js's loopLost) ---------- */
function startLost(g, lb, kind, pit) {

  g.fills = []; g.drinkT = 9;            // version 11: a drink's fill stops (kept potions stay kept, as Barney chose)
  g.lost = { kind, pit, x0: g.x, y0: g.y, lip: pit ? g.L.ground(g.x) : g.y, f: g.facing };
  // the last life (Barney, 7 November 2026): the armour, kept all run, shatters with the blow: each pip cracks in turn, with the card
  // shards, all done before the run's end at 0.8 s
  if (g.lives <= 1 && !g.safe && g.armour > 0) {
    const n = g.armour; g.armour = 0; g.hurtKind = 'armour';
    lb.hud.armour(0, { stagger: ARMOUR_SHATTER });
    for (let i = 0; i < n; i++) lb.after(i * ARMOUR_SHATTER, () => lb.sfx('crack'));
  }
}
function lostUpdate(g, lb, dt) {
  const t = g.mt, P = g.lost;
  if (!P.broke && t >= 0.34) {         // he breaks into card pieces: as he falls into the dark, or once he has buckled and knelt
    P.broke = true;
    lb.sfx('lifeLost');
    if (!g.safe) { g.lives--; lb.hud.lives(g.lives); }
    if (g.lives <= 0) { P.last = true; lb.runEnd(() => runEndInfo(g, lb), 0.8 - 0.34); }   // step 5d: the plaque 0.8 s after the blow
  }
  if (P.last) return;                  // the last life: no fade and no return; the scene holds still under the run's end
  const tOut = 0.34 + 0.8, tBlack = tOut + 0.35, tRet = tBlack + 0.3;
  lb.fade(t < tOut ? 0 : Math.min(1, (t - tOut) / 0.35));
  if (t >= tRet) {                     // back at the last lit checkpoint, forming in its light
    const cp = g.cps[g.lastCp];
    g.x = cp.x + RETURN_AT; g.y = surfaceAt(g, g.x); g.on = pieceUnder(g, g.x, g.y); g.vy = 0; g.facing = 1;
    g.mode = 'return'; g.mt = 0; g.safeT = 0; g.hurtT = 9;

    // loot picked up stays picked up
    g.shots = []; g.cast = null; g.castBuf = 0;

      g.boss = newBoss(g); lb.hud.boss(null);
      g.mons = g.mons.filter((m) => !m.summoned);
    }

  }
}
function returnUpdate(g, lb, dt) {
  const t = g.mt;
  lb.fade(Math.max(0, 1 - t / 0.35));
  const q = Math.round(Math.max(0, Math.min(1, (t - 0.3) / 0.5)) * 8) / 8;   // health and mana fill in steps
  lb.hud.health(q); lb.hud.mana(q);
  if (t >= 0.9) { g.mode = 'ground'; g.mt = 0; g.landT = 9; g.health = 1; g.mana = 1; }
}

/* ---------- the sword (4d-2a) ---------- */
function startSwing(g, lb) { g.mode = 'sword'; g.mt = 0; g.atkBuf = 0; g.swHit = false; lb.sfx('swing'); }
function swordUpdate(g, lb, dt, i) {
  const s = g.mt * lb.world.stepRate;
  if (!g.swHit && s >= 1) { g.swHit = true; swordHits(g, lb); }   // the blow lands on the strike
  if (s >= 2 && i.pressed.jump) return jump(g, lb);                // after the strike, a jump or a roll cuts the follow-through short
  if (s >= 2 && i.pressed.roll) return startRoll(g, lb);
  if (g.mt >= SWORD_T) { g.mode = 'ground'; g.mt = 0; g.landT = 9; }
}
// every monster in front of him, from his feet to above his head, as far as the blade reaches; each takes 1, and half more for each
// bite upgrade
function swordHits(g, lb) {
  const f = g.facing, reach = SWORD_REACH + REACH_UP * g.sword.reach, xa = g.x - 10 * f, xb = g.x + reach * f;
  const x0 = Math.min(xa, xb), x1 = Math.max(xa, xb), y0 = g.y - 135, y1 = g.y + 4;
  let hits = 0;
  for (const m of g.mons) {
    if (!alive(m)) continue;
    const b = monBox(m);
    if (b[1] < x0 || b[0] > x1 || b[3] < y0 || b[2] > y1) continue;
    hits++;
    damage(g, lb, m, 1 + 0.5 * g.sword.bite, f);
  }
  const bb = bossBody(g);
  if (bb && !(bb[1] < x0 || bb[0] > x1 || bb[3] < y0 || bb[2] > y1)) { hits++; bossDamage(g, lb, 1 + 0.5 * g.sword.bite); }
  if (hits) lb.sfx('hit');
}
function damage(g, lb, m, n, dir) {    // a blow or a fireball: it flares and jolts (the kit's)
  m.awake = true; m.hp -= n; m.hitT = 0;
  if (m.hp <= 0.01) return defeat(g, lb, m);
  // the mouth-hat and the ghoul strike back when struck while coming for him (ready to attack), rushing in for a second if out of reach
  if (MON[m.kind].answer && !m.atk && m.cd <= 0.25) { m.cd = 0; m.rush = 1.0; }
}
function defeat(g, lb, m) {            // card pieces and its wisp rising to the score (the kit's, 1.6 s); the echo counts as it arrives
  m.st = 'defeat'; m.t = 0; m.atk = null; m.wdx = 0; m.ody = 0; m.beatenAt = lb.time;
  const n = MON[m.kind].wisps;
  lb.sfx('defeat', n);                 // step 5d: the card tearing, then its wisp's echo, louder the more echo it gives
  g.echoDue += n;
  lb.after(0.9, () => { if (g.banked) return; g.echoDue -= n; lb.addWisps(n); });
  dropLoot(g, lb, m);
}

/* ---------- spells and mana (4d-3) ---------- */
function hudMana(g, lb, now) { if (now || Math.abs(g.mana - g.manaShown) >= 0.01 || g.mana >= 1) { lb.hud.mana(g.mana); g.manaShown = g.mana; } }
function hudSpells(g, lb) { const sp = g.spellList[g.sel]; lb.hud.spells(g.spellList.slice(), g.sel, sp ? SPELL[sp].cost : 0); }
function switchSpell(g, lb) { if (g.spellList.length < 2) return; g.sel = (g.sel + 1) % g.spellList.length; hudSpells(g, lb); }
// on the ground: the chosen spell, or, short of mana, the hand's light sputtering out (the kit's fizzle), nothing cast
function startCast(g, lb) {
  const sp = g.spellList[g.sel], cost = SPELL[sp].cost;
  g.castBuf = 0; g.mode = 'cast'; g.mt = 0;
  if (g.mana < cost - 1e-6) { g.cast = { move: 'fizzle', spell: sp, done: false }; return; }
  g.mana -= cost; hudMana(g, lb, true);
  g.cast = { move: sp === 'heal' ? 'heal' : 'fire', spell: sp, done: false };
}
function castUpdate(g, lb, dt) {
  const c = g.cast, s = g.mt * lb.world.stepRate, steps = lb.world.move(c.move, 0).steps;
  if (!c.done && c.move === 'heal') {  // the heal: a pale gold glow rises round him as the hand goes up (its "go" step)
    c.done = true; g.healT = 0; lb.sfx('heal');
    g.health = Math.min(1, g.health + SPELL.heal.amount[g.spells.heal]); lb.hud.health(g.health);
  }
  if (!c.done && s >= 1) {             // the throw (the fireball leaves on its "thr" step), or the fizzle's spark
    c.done = true;
    if (c.move === 'fizzle') lb.sfx('fizzle');
    else {
      // from just in front of him at chest height (the hand drawn last frame was still back in the wind-up)
      g.shots.push({ x: g.x + g.facing * 28, y: g.y - 52, f: g.facing, level: g.spells.fire, burst: null });

}
function shotsUpdate(g, lb, dt) {     // each fireball flies on until it hits a monster (and bursts there) or leaves the screen
  const camX = camAt(g, lb);
  for (const s of g.shots) {
    if (s.burst != null) { s.burst += dt; if (s.burst >= 0.4) s.gone = true; continue; }
    s.x += s.f * FIRE_SPEED * dt;

        return null;
      }
      // health run out: he buckles and kneels (the kit's lifeLost move, 4 steps), then breaks into his card pieces
      if (t < 0.34) { const s = Math.min(t * R, 3.99); return w.wanderer(P.x0 + P.f * w.move('lifeLost', s).dx, { move: 'lifeLost', step: s, y: P.y0 + 1, facing: P.f, sword: g.sword, hurt: { kind: g.hurtKind, t: g.hurtT } }); }
      if (t < 0.34 + 1.1) return w.wanderer(P.x0, { shatter: t - 0.34, y: P.y0 + 1, facing: P.f });
      return null;
    }
    case 'return': {
      const r = w.wanderer(g.x, { move: 'idle', step: g.mt * R, form: g.mt, y, facing: f, sword: g.sword });
      if (g.mt < 0.3 && g.glass[g.lastCp]) w.spark(g.glass[g.lastCp], r.lantern, g.mt / 0.3);
      return r;
    }
    case 'over': return null;
    case 'climb': {
      const c = g.climb, s = Math.min(g.mt * R, c.steps - 1e-3), m = w.move('climb', s);
      return w.wanderer(c.foot + f * m.dx, o({ move: 'climb', step: s, y: c.y0 + 1 + m.dy * c.scale }));
    }
    case 'roll': return w.wanderer(g.x, o({ move: 'roll', step: g.mt < ROLL_T ? g.mt * R : 3 + ((g.mt - ROLL_T) * R) % 1 }));   // carrying on: tumbling still
    case 'sword': return w.wanderer(g.x, o({ move: 'sword', step: Math.min(g.mt * R, 3.99) }));
    case 'hurt': return w.wanderer(g.x, o({ move: 'hurt', step: Math.min(g.mt * R, 2.99) }));
    case 'cast': {                     // heal, the fireball's throw, or the fizzle (its sparks from the "fiz" step)
      const c = g.cast, steps = w.move(c.move, 0).steps;
      return w.wanderer(g.x, o({ move: c.move, step: Math.min(g.mt * R, steps - 0.01), fizzle: c.move === 'fizzle' && g.mt * R >= 1 ? g.mt - 1 / R : undefined }));
    }
    case 'air': {
      if (g.air === 'drop') return w.wanderer(g.x, o({ move: 'drop', step: g.airT < 1 / R ? 0 : 1.5 }));
      const step = g.airT < 1 / R ? 1 : g.vy < -250 ? 2.5 : g.vy <= 250 ? 4 : 5.5;   // launch, rising, the top, falling
      return w.wanderer(g.x, o({ move: 'jump', step }));
    }
    default: {
      if (g.landT < 2 / R) return w.wanderer(g.x, o({ move: 'jump', step: 7 + g.landT * R }));   // landing, then recovering
      const walking = g.mode === 'ground' && (lb.input.left || lb.input.right) || (g.mode === 'card' && g.out);
      if (walking) return w.wanderer(g.x, o({ move: 'walk', step: g.out ? g.x / STRIDE : g.walkDist / STRIDE }));
      return w.wanderer(g.x, o({ move: 'idle', step: lb.time * R }));
    }
  }
}
</script>
