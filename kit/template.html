<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Kit game</title><!-- the kit replaces this with the game's title -->
<!-- The kit. build.py copies both files (and the fonts) into dist/<game>.html. Keep data-rk-inline. -->
<link rel="stylesheet" href="../../kit/retro-kit.css" data-rk-inline>
<script src="../../kit/retro-kit.js" data-rk-inline></script>
</head>
<body>
<script>
/* MY GAME — a Retro Kit game. Rules for this file: .claude/skills/retro-kit/SKILL.md */
RetroKit.game({
  id: 'my-game',                 // the folder name: lowercase-with-hyphens; high scores are saved under it
  title: 'MY GAME',              // invented name, ALL CAPS, 12 characters or fewer per line
  lives: 3,
  hud: ['score', 'best', 'lives', 'level'],
  keys: [['←', '→', 'Move'], ['Space', 'Fire'], ['P', 'Pause']],
  touch: 'Drag to move · Tap to fire',

  sprites: {
    // A few shapes in the sprite's box (world pixels). A ramp name ('chrome', 'aqua', 'red', 'amber', 'heat')
    // paints light, base and dark bands; a token ('ink', 'sun-100') one flat colour. The kit adds the outline.
    // Full list of shapes and options: the skill's reference.md, Sprites.
    player: {
      size: [12, 8],
      shapes: [
        { poly: [6, 0, 12, 7, 12, 8, 0, 8, 0, 7], fill: 'chrome', band: [0.4, 0.75] },
        { circle: [6, 4.4, 1.6], fill: 'aqua' },
      ],
    },
  },

  // New game: build and return this game's state. Score and lives are handled by the kit.
  start(rk) {
    rk.hud.set('level', 1);
    return { x: rk.W / 2 - 6, y: rk.H - 20, level: 1 };
  },

  // Rules: called 60 times a second during play.
  update(g, rk) {
    const speed = 2;
    if (rk.input.left) g.x -= speed;
    if (rk.input.right) g.x += speed;
    if (rk.input.pointer.down) g.x += rk.input.pointer.dx;   // drag anywhere: touch, or mouse on desktop
    g.x = rk.clamp(g.x, 0, rk.W - 12);
  },

  // Picture: called every frame. Draw the backdrop first, then the world.
  draw(ctx, g, rk) {
    rk.backdrop.space();
    rk.draw('player', g.x, g.y);
  },
});
</script>
</body>
</html>
