/* CHROME CHOMP — a Retro Kit game. Rules for this file: .claude/skills/retro-kit/SKILL.md
   A maze chase: steer a chrome chomper round a maze, eat every light, and keep away from four gremlins.
   Two modes, picked from the kit's menu after Start game (the modes option, at the bottom):
     Classic   the four big orbs turn the gremlins blue for a few seconds, and then you can eat them.
     Advanced  the same, plus capsules that drop into the maze: a laser, turbo, freeze, a magnet,
               a bomb and a shield. Level 1 has the first two; each level adds the next one.
   Five mazes, each with its own look. After the last one the set repeats, faster.
   The soundtrack is Barney's own MP3, kept in music.js. The kit plays it: see the music option, at the bottom. */

/* ---------- Playfield layout (game pixels; the world is 320 x 180) ---------- */
const T = 10;                   // one maze tile
const COLS = 31;                // tiles across that are on screen
const ROWS = 17;
const WRAP = 32;                // 31 columns plus one hidden behind the screen edge: 320 pixels, so the tunnels join up
const OX = 5;                   // the maze sits 5 pixels in from every edge
const OY = 5;
const WALL = 0, PATH = 1, PEN = 2, DOOR = 3;
const UP = 0, LEFT = 1, DOWN = 2, RIGHT = 3;
const DX = [0, -1, 0, 1];
const DY = [-1, 0, 1, 0];
const FACE = ['U', 'L', 'D', 'R'];
const EXIT = { c: 15, r: 5 };   // the tile just above the pen door: gremlins come out and go home here
const PEN_ROW = 7;
const START = { c: 15, r: 11 }; // where the chomper begins
const BONUS = { c: 15, r: 9 };  // where the bonus gem appears
const SWIPE = 7;                // how far a finger travels (game pixels) before it counts as a turn
const TOUCH = 7;                // how close two things must be (pixels, centre to centre) to touch
const TURBO = 1.6;              // how much faster the chomper goes with Turbo
const FREEZE_TIME = 5 * 60;     // updates (5 seconds)
const MAGNET_REACH = 27;        // pixels
const BLAST_REACH = 50;
const tx = (c) => OX + c * T + T / 2;      // the centre of a tile, in pixels
const ty = (r) => OY + r * T + T / 2;
const wrapC = (c) => (c + WRAP) % WRAP;

/* How each maze looks. wall = the three tones of its walls (light edge, body, dark edge). sky = the floor,

/* Advanced mode capsules. time = how long the power lasts, in updates (0 = it happens at once). */
const POWERS = {

  turbo: { sprite: 'capTurbo', label: 'TURBO', time: 6 * 60 },      // much faster

  shield: { sprite: 'capShield', label: 'SHIELD', time: 15 * 60 },  // takes one hit for you

/* How hard a level is. Speeds are pixels per update (60 updates a second). Each level is about 5% faster
   and the gremlins get closer to your speed; power orbs last a little less each time. */
function tuning(level, advanced) {
  const n = level - 1;
  const speed = Math.min(1.5, 1.1 * Math.pow(1.05, n));
  const chase = Math.min(0.96, 0.84 + 0.03 * n) + (advanced ? 0.02 : 0);
  return {
    speed: speed,
    foe: speed * chase,
    fright: Math.max(150, 420 - 45 * n),                  // updates the gremlins stay blue after a power orb
    cast: !advanced && level === 1 ? [0, 1, 3] : [0, 1, 2, 3],     // Classic level 1 has three gremlins, not four
    // The gremlins take turns drifting to their corners and hunting. Updates: drift, hunt, drift, hunt...
    waves: n < 2 ? [420, 1200, 420, 1200, 300, 1200, 300] : n < 4 ? [300, 1200, 300, 1200, 180] : [240, 1200, 180],
    // When each one leaves the pen: after this many updates, or once this many lights have been eaten.
    leaveAfter: [0, 60, Math.max(120, 360 - 40 * n), Math.max(240, 720 - 80 * n)],
    leaveDots: [0, 0, 20, 45],
  };
}

/* ---------- Art ----------
   Every sprite is a few shapes in its own box (game pixels), drawn by the kit at the screen's real
   resolution: flat colour in hard bands, light from above, an ink outline round the outside. A ramp name
   ('red', 'heat', 'amber', 'aqua', 'chrome') as a fill gives light, base and dark bands; a token
   ('sun-100', 'ink') gives one flat colour; a list gives bands of your own. mirror: true and turn: 1-3
   make the chomper face each way, with the light still from above. */

/* The chomper, facing right: a chrome robot head with an aqua visor and a jaw at the front that opens
   and shuts (shut, half open, wide open). */
function chompFrame(open) {
  const head = [
    { rect: [0.4, 0.4, 11.2, 11.2], r: 3.4, fill: 'chrome', band: [0.36, 0.74] },
    { rect: [5.2, 2.2, 4.2, 2.3], r: 1.1, fill: 'aqua', band: [0.4, 0.8] },
  ];
  if (!open) return [...head, { line: [6.4, 7.4, 11.4, 7.4], width: 0.7, fill: 'ink' }];
  const h = open === 1 ? 2.6 : 4.6;                     // how far the jaw has dropped
  const top = 7.4 - h / 2;
  const teeth = [];
  for (const x of [7.2, 9.2, 11]) {
    teeth.push({ poly: [x - 0.6, top, x + 0.6, top, x, top + 1], fill: 'chrome-100' });
    if (open === 2) teeth.push({ poly: [x - 1.6, top + h, x - 0.4, top + h, x - 1, top + h - 1], fill: 'chrome-100' });
  }
  return [...head, { rect: [5.6, top, 6.4, h], r: Math.min(1.2, h / 2), fill: 'ink' }, ...teeth];
}
const CHOMP = { size: [12, 12], frames: [chompFrame(0), chompFrame(1), chompFrame(2)] };

/* The gremlins: a body in rows 0-9, then feet in rows 10-11 that swap to make them scuttle. Their eyes
   are drawn on top while the game runs, so that they can look where they are going. */

  const b = [[2.4, 2.6], [7, 2.6]].map((f) => ({ rect: [f[0], 9.8, f[1], 2], r: 1, fill: tone }));
  return { size: [12, 12], frames: [[...(feet === 'swap' ? b : a), ...body], [...(feet === 'swap' ? a : b), ...body]] };
}

  { path: 'M0 10 L0 5.4 C0 2.6 2.6 1 6 1 C9.4 1 12 2.6 12 5.4 L12 10 Z', fill: ['aqua', 0.3, 'aqua-dark'] },

const CAPS = {

function buildSprites() {
  const s = {
    chompR: CHOMP,

      { ellipse: [2, 2, 2, 1.9], fill: 'chrome-100' }, { ellipse: [8, 2, 2, 1.9], fill: 'chrome-100' }] },
    eyeOne: { size: [6, 5], shapes: [{ ellipse: [3, 2.5, 3, 2.5], fill: 'chrome-100' }] },
    orb: { size: [6, 6], shapes: [         // the power orb
      { circle: [3, 3, 2.9], fill: 'amber', band: [0.3, 0.72] }, { circle: [2.1, 2, 0.7], fill: 'sun-100' }] },
    gem: { size: [8, 7], shapes: [         // the bonus
      { poly: [2, 0, 6, 0, 8, 2.4, 4, 7, 0, 2.4], fill: 'amber', band: [0.34, 0.7] },
      { poly: [2.4, 0.5, 5.6, 0.5, 4.8, 2.2, 3.2, 2.2], fill: 'sun-100' }] },
  };
  for (const name in CAPS) s[name] = { size: [8, 8], shapes: CAPS[name] };
  return s;
}

/* ---------- Building a maze ---------- */
let mazes = [];                 // one entry per maze, worked out once when the page opens (see init)

// Turns one maze's text into what the game needs: which tiles are open, where the lights and orbs are,
// which rows are tunnels, and how far every tile is from the pen (so a caught gremlin's eyes can run home).
function buildMaze(half) {
  const cells = new Uint8Array(ROWS * WRAP);
  const dots = [];
  const orbs = [];
  const tunnels = [];
  half.forEach((h, r) => {
    if (h.length !== 16) console.warn('Chrome Chomp: maze row ' + r + ' is ' + h.length + ' wide, not 16: ' + h);
    const row = h + h.slice(0, 15).split('').reverse().join('');
    for (let c = 0; c < COLS; c++) {
      const ch = row[c];
      const i = r * WRAP + c;
      cells[i] = ch === '#' ? WALL : ch === '-' ? DOOR : ch === 'p' ? PEN : PATH;
      if (ch === '.') dots.push(i);
      if (ch === 'o') orbs.push(i);
    }
    if (row[0] !== '#') {                   // a tunnel: the hidden column joins the two ends
      tunnels.push(r);
      cells[r * WRAP + COLS] = PATH;
    }
  });
  const home = new Int16Array(ROWS * WRAP).fill(-1);
  const queue = [EXIT.r * WRAP + EXIT.c];
  home[queue[0]] = 0;
  for (let q = 0; q < queue.length; q++) {
    const i = queue[q];
    const c = i % WRAP;
    const r = (i - c) / WRAP;
    for (let d = 0; d < 4; d++) {
      const nr = r + DY[d];
      if (nr < 0 || nr >= ROWS) continue;
      const n = nr * WRAP + wrapC(c + DX[d]);
      if (cells[n] === PATH && home[n] < 0) { home[n] = home[i] + 1; queue.push(n); }
    }
  }
  return { cells: cells, dots: dots, orbs: orbs, tunnels: tunnels, home: home };
}

// Draws a maze's walls as one big sprite, 320 x 180, in its theme's colours: rounded tubes 4 pixels thick
// that run through the middle of their tiles, which leaves the corridors wide enough for the 12-pixel sprites.
// Each tube is drawn three times: a dark edge (down and right), a light edge (up and left), then the body.
function mazeArt(maze, theme) {
  const isWall = (c, r) => {
    if (r < 0 || r >= ROWS) return false;
    if (c >= 0 && c < COLS) return maze.cells[r * WRAP + c] === WALL;
    // Just off the screen: the walls above and below a tunnel carry on to the very edge
    const tunnel = (row) => maze.tunnels.indexOf(row) >= 0;
    return (c === -1 || c === COLS) && !tunnel(r) && (tunnel(r - 1) || tunnel(r + 1));
  };
  const segs = [];              // [x1, y1, x2, y2]: from one wall tile's middle to the next one's
  const blocks = [];            // where four wall tiles make a solid square
  const tiles = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = -1; c <= COLS; c++) {
      if (!isWall(c, r)) continue;
      const x = OX + c * T + T / 2;
      const y = OY + r * T + T / 2;
      tiles.push([x, y, c, r]);
      if (isWall(c + 1, r)) segs.push([x, y, x + T, y]);
      if (isWall(c, r + 1)) segs.push([x, y, x, y + T]);
      if (!isWall(c + 1, r) && !isWall(c, r + 1) && !isWall(c - 1, r) && !isWall(c, r - 1)) segs.push([x, y, x, y]);
      if (isWall(c + 1, r) && isWall(c, r + 1) && isWall(c + 1, r + 1)) blocks.push([x, y]);
    }
  }
  const [light, body, dark] = theme.wall;
  const shapes = [];
  const pass = (dx, dy, width, fill, erase) => {
    for (const b of blocks) shapes.push({ rect: [b[0] - width / 2 + dx, b[1] - width / 2 + dy, T + width, T + width], r: width / 2, fill: fill, erase: erase });
    for (const sg of segs) shapes.push({ line: [sg[0] + dx, sg[1] + dy, sg[2] + dx + (sg[0] === sg[2] && sg[1] === sg[3] ? 0.01 : 0), sg[3] + dy], width: width, fill: fill, erase: erase });
  };
  pass(0.3, 0.3, 3.8, dark);
  pass(-0.3, -0.3, 3.8, light);
  if (theme.hollow) pass(0, 0, 2.2, body, true);    // neon tubes: the middle cut away, so the stars show through
  else pass(0, 0, 3, body);
  if (theme.marks) {
    for (const [x, y, c, r] of tiles) {
      if (!theme.marks(c, r)) continue;
      if (theme.mark === 'leaf') shapes.push({ ellipse: [x - 0.3, y - 0.2, 0.9, 0.55, -30], fill: light });
      else if (theme.mark === 'rivet') shapes.push({ circle: [x, y, 0.55], fill: light });
      else if (theme.mark === 'joint') shapes.push({ line: isWall(c + 1, r) || isWall(c - 1, r) ? [x, y - 1.2, x, y + 1.2] : [x - 1.2, y, x + 1.2, y], width: 0.5, fill: dark });
      else if (theme.mark === 'stripe') shapes.push({ line: [x - 0.9, y + 0.9, x + 0.9, y - 0.9], width: 0.5, fill: light });
    }
  }
  return { size: [320, 180], outline: false, shapes: shapes };
}

/* ---------- Helpers ---------- */

// A small repeatable random number maker, so each maze's scenery is the same every time.
function rng(seed) {
  return function () {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

// Plays a sound at most once every few updates, so repeats do not become a buzz.
function play(g, rk, name, wait) {
  if (g.cool[name] > 0) return;
  g.cool[name] = wait || 6;
  rk.sfx(name);
}

function spark(g, x, y, colours, count, power) {
  for (let i = 0; i < count && g.parts.length < 160; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.3 + Math.random() * 0.7) * power;
    g.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 16 + Math.random() * 18, colour: colours[i % colours.length] });
  }
}

const cellAt = (g, c, r) => (r < 0 || r >= ROWS ? WALL : g.maze.cells[r * WRAP + wrapC(c)]);
const canGo = (g, c, r, d) => cellAt(g, c + DX[d], r + DY[d]) === PATH;

// Where something is, in pixels (its centre). The chomper and roaming gremlins are placed by tile: the
// tile they last reached (c, r) plus how far they have gone towards the next one (off). Gremlins in or
// around the pen move freely instead (fx, fy).
function spot(e) {
  if (e.state === 'pen' || e.state === 'leave' || e.state === 'enter') return [e.fx, e.fy];
  if (e.dir < 0) return [tx(e.c), ty(e.r)];
  return [tx(e.c) + DX[e.dir] * e.off, ty(e.r) + DY[e.dir] * e.off];
}

// How far apart two points are, allowing for the tunnels joining the two sides of the screen.
function gap(ax, ay, bx, by) {
  let dx = Math.abs(ax - bx);
  if (dx > 160) dx = 320 - dx;
  return Math.hypot(dx, ay - by);
}

// Turns something round on the spot, wherever it is in a corridor.
function reverse(e) {
  if (e.dir < 0) return;
  if (e.off > 0) {
    e.c = wrapC(e.c + DX[e.dir]);
    e.r += DY[e.dir];
    e.off = T - e.off;
  }
  e.dir = (e.dir + 2) % 4;
}

/* ---------- Levels and lives ---------- */

function setupLevel(g, rk) {
  g.stage = (g.level - 1) % MAZES.length;
  g.maze = mazes[g.stage];
  g.theme = THEMES[g.stage];
  g.tune = tuning(g.level, g.advanced);
  g.dots = new Uint8Array(ROWS * WRAP);       // 1 = a light, 2 = a power orb
  for (const i of g.maze.dots) g.dots[i] = 1;
  for (const i of g.maze.orbs) g.dots[i] = 2;
  g.total = g.maze.dots.length + g.maze.orbs.length;
  g.left = g.total;
  g.eaten = 0;
  g.gem = null;
  g.gems = 0;
  g.caps = [];
  g.capT = 180;                               // Advanced: the first capsule drops after 3 seconds
  g.kinds = UNLOCKS.slice(0, Math.min(UNLOCKS.length, g.level + 1));
  resetActors(g);
  g.phase = 'ready';
  rk.hud.set('level', g.level);
  rk.hud.set('power', 0);
  rk.banner(g.theme.name, 1.8);
  rk.after(1.8, () => { if (g.phase === 'ready') g.phase = 'play'; });
}

// Puts the chomper back at the start and the gremlins back in the pen: a new level, or a new life.
function resetActors(g) {
  g.player = { c: START.c, r: START.r, dir: -1, off: 0, face: LEFT, want: -1, trail: [] };
  g.foes = g.tune.cast.map((kind, n) => {
    const e = { kind: kind, slot: n, c: EXIT.c, r: EXIT.r, dir: -1, off: 0, state: 'roam', scared: false, turn: false, wait: 0, fx: 0, fy: 0 };
    if (n > 0) {                              // the first starts outside; the rest wait in the pen
      e.state = 'pen';
      e.fx = tx([15, 13, 17][n - 1]);
      e.fy = ty(PEN_ROW);
    }
    return e;
  });
  g.lifeT = 0;                                // updates since this life began
  g.lifeDots = 0;                             // lights eaten in this life
  g.wave = 0;
  g.waveT = g.tune.waves[0];
  g.drift = true;                             // true = the gremlins head for their corners; false = they hunt
  g.fright = 0;
  g.frightMax = 1;
  g.chain = 0;
  g.freeze = 0;
  g.safe = 0;
  g.pw = { laser: 0, turbo: 0, magnet: 0, shield: 0 };
  g.bolts = [];
  g.pulls = [];
  g.blast = null;
  g.fireCool = 0;
  g.hold = 0;
  g.swipe = null;
}

/* ---------- The chomper ---------- */

// Which way the player has just asked to go, if any. Keys, or a swipe; a long drag can make several turns.
function readTurn(g, rk) {
  const inp = rk.input;
  const p = inp.pointer;
  let d = inp.pressed.up ? UP : inp.pressed.down ? DOWN : inp.pressed.left ? LEFT : inp.pressed.right ? RIGHT : -1;
  if (p.pressed) g.swipe = { dx: 0, dy: 0 };
  const s = g.swipe;
  if (s && p.down) {
    s.dx += p.dx;
    s.dy += p.dy;
    const ax = Math.abs(s.dx);
    const ay = Math.abs(s.dy);
    if (Math.max(ax, ay) >= SWIPE) {
      d = ax > ay ? (s.dx < 0 ? LEFT : RIGHT) : (s.dy < 0 ? UP : DOWN);
      s.dx = 0;
      s.dy = 0;
    }
  }
  if (p.released) g.swipe = null;
  return d;
}

function stepPlayer(g, rk) {
  const p = g.player;
  // The turn you asked for is remembered until the next place it can happen. Turning back is instant.
  if (p.dir >= 0 && p.want === (p.dir + 2) % 4) reverse(p);
  let left = g.tune.speed * (g.pw.turbo > 0 ? TURBO : 1);
  for (let guard = 0; left > 0 && guard < 6; guard++) {
    if (p.off === 0) {                        // in the middle of a tile: the only place to turn or stop
      if (p.want >= 0 && canGo(g, p.c, p.r, p.want)) p.dir = p.want;
      else if (p.dir >= 0 && !canGo(g, p.c, p.r, p.dir)) p.dir = -1;
      if (p.dir < 0) break;
    }
    const m = Math.min(left, T - p.off);
    p.off += m;
    left -= m;
    if (p.off >= T - 0.000001) {
      p.c = wrapC(p.c + DX[p.dir]);
      p.r += DY[p.dir];
      p.off = 0;
    }
  }
  if (p.dir >= 0) p.face = p.dir;
  const at = spot(p);
  p.trail.unshift(at);
  if (p.trail.length > 8) p.trail.pop();
  // Eat whatever is on the tile the chomper is mostly over
  const ahead = p.dir >= 0 && p.off >= T / 2;
  const i = (ahead ? p.r + DY[p.dir] : p.r) * WRAP + (ahead ? wrapC(p.c + DX[p.dir]) : p.c);
  if (g.dots[i] === 1) eatDot(g, rk, i);
  else if (g.dots[i] === 2) eatOrb(g, rk, i);
}

function eatDot(g, rk, i) {
  g.dots[i] = 0;
  g.left--;
  g.eaten++;
  g.lifeDots++;
  rk.addScore(10);
  if (!(g.cool.dot > 0)) {                    // two notes taking turns
    g.cool.dot = 5;
    g.note = !g.note;
    rk.sfx.tone({ type: 'triangle', f: g.note ? 494 : 392, dur: 0.06, vol: 0.16 });
  }
  // The gem shows up twice a level, after about a third and two thirds of the lights
  if (g.gems < 2 && g.eaten >= g.total * (g.gems ? 0.7 : 0.35)) {
    g.gems++;
    g.gem = { t: 9 * 60 };
  }
}

function eatOrb(g, rk, i) {
  g.dots[i] = 0;
  g.left--;
  g.eaten++;
  rk.addScore(50);
  rk.sfx('pickup');
  g.fright = g.frightMax = g.tune.fright;
  g.chain = 0;
  for (const e of g.foes) {
    if (e.state === 'eyes' || e.state === 'enter') continue;
    e.scared = true;
    if (e.state === 'roam') e.turn = true;    // they turn tail at once
  }
}

/* ---------- The gremlins ---------- */

// The tile a gremlin is trying to reach. They always take the turning that brings them nearest to it
// and never turn back on themselves, which is what lets a careful player out-fox them.
function target(g, e) {
  if (g.drift) return FOES[e.kind].corner;
  const p = g.player;
  const d = p.face;
  if (e.kind === 1) return [p.c + DX[d] * 3, p.r + DY[d] * 3];
  if (e.kind === 2) {                         // a point as far beyond you as the first gremlin is behind
    const lead = g.foes[0];
    return [2 * (p.c + DX[d] * 2) - lead.c, 2 * (p.r + DY[d] * 2) - lead.r];
  }
  if (e.kind === 3) {
    const near = (e.c - p.c) * (e.c - p.c) + (e.r - p.r) * (e.r - p.r) <= 36;
    return near ? FOES[3].corner : [p.c, p.r];
  }
  return [p.c, p.r];
}

function chooseDir(g, e) {
  const eyes = e.state === 'eyes';
  const back = e.dir < 0 || eyes ? -1 : (e.dir + 2) % 4;
  const ways = [];
  for (let d = 0; d < 4; d++) if (d !== back && canGo(g, e.c, e.r, d)) ways.push(d);
  if (!ways.length) { e.dir = back >= 0 && canGo(g, e.c, e.r, back) ? back : -1; return; }
  let best = ways[0];
  if (eyes) {                                 // caught: the shortest way home
    let least = 9999;
    for (const d of ways) {
      const n = g.maze.home[(e.r + DY[d]) * WRAP + wrapC(e.c + DX[d])];
      if (n >= 0 && n < least) { least = n; best = d; }
    }
  } else if (e.scared) best = ways[Math.floor(Math.random() * ways.length)];
  else if (ways.length > 1) {
    const t = target(g, e);
    let least = Infinity;
    for (const d of ways) {
      const dx = e.c + DX[d] - t[0];
      const dy = e.r + DY[d] - t[1];
      if (dx * dx + dy * dy < least) { least = dx * dx + dy * dy; best = d; }
    }
  }
  e.dir = best;
}

function stepFoe(g, rk, e) {
  const frozen = g.freeze > 0;
  if (e.state === 'pen') {
    if (frozen) return;
    if (e.wait > 0) { if (--e.wait === 0) e.state = 'leave'; }        // back from being caught: out again soon
    else if (g.lifeT >= g.tune.leaveAfter[e.slot] || (g.tune.leaveDots[e.slot] && g.lifeDots >= g.tune.leaveDots[e.slot])) e.state = 'leave';
    return;
  }
  if (e.state === 'leave') {                  // to the middle of the pen, then up through the door
    if (frozen) return;
    const gx = tx(EXIT.c);
    const gy = ty(EXIT.r);
    if (Math.abs(e.fx - gx) > 0.01) e.fx += Math.sign(gx - e.fx) * Math.min(0.6, Math.abs(gx - e.fx));
    else if (e.fy > gy) e.fy = Math.max(gy, e.fy - 0.6);
    else { e.state = 'roam'; e.c = EXIT.c; e.r = EXIT.r; e.off = 0; e.dir = -1; e.turn = false; }
    return;
  }
  if (e.state === 'enter') {                  // eyes dropping back into the pen
    e.fy = Math.min(ty(PEN_ROW), e.fy + 1.6);
    if (e.fy >= ty(PEN_ROW)) { e.state = 'pen'; e.wait = 50; }
    return;
  }
  const eyes = e.state === 'eyes';
  if (frozen && !eyes) return;
  if (e.turn) { e.turn = false; reverse(e); }
  let left = g.tune.foe;
  if (eyes) left = 2.4;
  else if (e.scared) left *= 0.6;
  else if (g.maze.tunnels.indexOf(e.r) >= 0 && (e.c <= 1 || e.c >= COLS - 2)) left *= 0.55;     // tunnels slow them
  else if (e.kind === 0 && g.left <= 20) left *= 1.08;                                           // the first one hurries at the end
  for (let guard = 0; left > 0 && guard < 6; guard++) {
    if (e.off === 0) {
      if (eyes && e.c === EXIT.c && e.r === EXIT.r) { e.state = 'enter'; e.fx = tx(EXIT.c); e.fy = ty(EXIT.r); return; }
      chooseDir(g, e);
      if (e.dir < 0) return;
    }
    const m = Math.min(left, T - e.off);
    e.off += m;
    left -= m;
    if (e.off >= T - 0.000001) {
      e.c = wrapC(e.c + DX[e.dir]);
      e.r += DY[e.dir];
      e.off = 0;
    }
  }
}

// A gremlin is caught: its eyes run back to the pen and it comes out again as good as new.
function catchFoe(g, rk, e, points, loud) {
  const at = spot(e);
  e.state = 'eyes';
  e.scared = false;
  e.turn = false;
  rk.addScore(points, at[0], at[1] - 8, 'aqua');
  spark(g, at[0], at[1], loud ? ['red-light', 'red', 'heat', 'chrome-200'] : ['aqua-light', 'aqua', 'chrome-200'], 12, 1.4);
  if (loud) play(g, rk, 'explosion', 10);
  else rk.sfx.tone({ f: 300, to: 1100, dur: 0.16, vol: 0.2 });
}

function die(g, rk) {
  g.phase = 'dying';
  g.dieT = 0;
  rk.sfx('hit');
}

// Every update of the short pause after being caught. The chomper bursts, then (if lives remain) a fresh start.
function stepDying(g, rk) {
  if (++g.dieT !== 24) return;
  const at = spot(g.player);
  spark(g, at[0], at[1], ['chrome-100', 'chrome-200', 'chrome-300', 'aqua'], 26, 1.8);
  rk.sfx('explosion');
  rk.shake(3, 0.2);
  if (rk.loseLife() > 0) {
    rk.after(1.2, () => {
      resetActors(g);
      g.phase = 'ready';
      rk.hud.set('power', 0);
      rk.after(1, () => { if (g.phase === 'ready') g.phase = 'play'; });
    });
  }
}

/* ---------- Advanced mode: capsules ---------- */

function dropCapsule(g, rk) {
  const p = g.player;
  const pool = g.kinds.filter((k) => k !== g.lastKind);
  for (let tries = 0; tries < 30; tries++) {
    const i = rk.pick(g.maze.dots);           // anywhere a light started out
    const c = i % WRAP;
    const r = (i - c) / WRAP;
    if (Math.abs(c - p.c) + Math.abs(r - p.r) < 6) continue;          // never right under your nose
    if (g.caps.some((cp) => cp.c === c && cp.r === r)) continue;
    const kind = rk.pick(pool.length ? pool : g.kinds);
    g.lastKind = kind;
    g.caps.push({ c: c, r: r, kind: kind, t: 14 * 60 });
    spark(g, tx(c), ty(r), ['amber-light', 'amber'], 8, 0.9);
    rk.sfx.tone({ type: 'triangle', f: 880, to: 1320, dur: 0.09, vol: 0.12 });
    return;
  }
}

function usePower(g, rk, kind, x, y) {
  rk.addScore(50);
  rk.popup(POWERS[kind].label, x, y - 9, 'amber');
  rk.sfx('pickup');
  if (kind === 'freeze') g.freeze = FREEZE_TIME;
  else if (kind === 'bomb') {
    g.blast = { x: x, y: y, t: 0 };
    rk.sfx('explosion');
    rk.shake(3, 0.2);
    spark(g, x, y, ['sun-100', 'amber', 'heat', 'heat-light'], 24, 2.2);
    for (const e of g.foes) {
      const at = spot(e);
      if (e.state === 'roam' && gap(x, y, at[0], at[1]) <= BLAST_REACH) catchFoe(g, rk, e, 200, true);
    }
  } else g.pw[kind] = POWERS[kind].time;
}

function stepCapsules(g, rk, px, py) {
  for (const cp of g.caps) {
    cp.t--;
    if (gap(px, py, tx(cp.c), ty(cp.r)) < TOUCH) {
      cp.t = 0;
      usePower(g, rk, cp.kind, tx(cp.c), ty(cp.r));
    }
  }
  g.caps = g.caps.filter((cp) => cp.t > 0);
  if (--g.capT <= 0) {
    g.capT = 540 + rk.randInt(0, 180);        // then another every 9 to 12 seconds, two at most
    if (g.caps.length < 2) dropCapsule(g, rk);
  }
}

function stepPowers(g, rk, px, py) {
  const p = g.player;
  for (const k in g.pw) if (g.pw[k] > 0) g.pw[k]--;
  if (g.fireCool > 0) g.fireCool--;
  // Laser: Space or a tap fires a bolt the way the chomper is facing
  if (g.pw.laser > 0 && g.fireCool <= 0 && (rk.input.pressed.fire || rk.input.pressed.alt || rk.input.tap)) {
    g.fireCool = 16;
    g.bolts.push({ x: (px + 320) % 320, y: py, dir: p.face, life: 150, dead: false });
    play(g, rk, 'shot', 6);
  }
  for (const b of g.bolts) {
    for (let s = 0; s < 2 && !b.dead; s++) {  // two short steps an update, so a bolt cannot jump over anything
      b.x = (b.x + DX[b.dir] * 2.5 + 320) % 320;
      b.y += DY[b.dir] * 2.5;
      if (cellAt(g, Math.floor((b.x - OX) / T), Math.floor((b.y - OY) / T)) !== PATH) {
        b.dead = true;
        spark(g, b.x, b.y, ['aqua-light', 'aqua'], 4, 0.8);
        break;
      }
      for (const e of g.foes) {
        const at = spot(e);
        if (e.state === 'roam' && gap(b.x, b.y, at[0], at[1]) < TOUCH) { catchFoe(g, rk, e, 200, true); b.dead = true; break; }
      }
    }
    if (--b.life <= 0) b.dead = true;
  }
  g.bolts = g.bolts.filter((b) => !b.dead);
  // Magnet: lights within reach are eaten from where they are, and a spark flies in from each
  if (g.pw.magnet > 0) {
    for (let r = p.r - 3; r <= p.r + 3; r++) {
      for (let c = p.c - 3; c <= p.c + 3; c++) {
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
        const i = r * WRAP + c;
        if (g.dots[i] !== 1 || gap(px, py, tx(c), ty(r)) > MAGNET_REACH) continue;
        eatDot(g, rk, i);
        g.pulls.push({ x: tx(c), y: ty(r), t: 0 });
      }
    }
  }
}

/* ---------- Drawing ---------- */

// Draws something that might be half-way through a tunnel: once where it is, and again on the far side.
function wrapped(x, fn) {
  fn(x);
  if (x < 12) fn(x + 320);
  else if (x > 308) fn(x - 320);
}

function drawFloor(rk, th) {
  if (th.space) rk.backdrop.space({ planet: false, terrain: false });
  else {
    th.sky.forEach((band, i) => {
      const next = i + 1 < th.sky.length ? th.sky[i + 1][0] : 180;
      rk.rect(0, band[0], 320, next - band[0], band[1]);
    });
  }
  for (const s of th.specks) rk.circle(s.x + 0.5, s.y + 0.5, 0.5, s.colour);
}

function drawEyes(rk, bx, by, dir, oneEye) {
  const ex = dir >= 0 ? DX[dir] : 0;
  const ey = dir >= 0 ? DY[dir] : 0;
  if (oneEye) {
    rk.draw('eyeOne', bx + 3 + ex, by + 3 + ey);
    rk.circle(bx + 6 + ex * 2, by + 5.5 + ey * 2, 1.15, 'ink');
    return;
  }
  rk.draw('eyes', bx + 1 + ex, by + 3 + ey);
  rk.circle(bx + 3 + ex * 2, by + 5 + ey * 2, 1, 'ink');
  rk.circle(bx + 9 + ex * 2, by + 5 + ey * 2, 1, 'ink');
}

function drawFoe(rk, g, e) {
  const at = spot(e);
  const by = Math.round(at[1]) - 6;
  const step = (g.tick >> 3) & 1;
  const info = FOES[e.kind];
  wrapped(at[0], (x) => {
    const bx = Math.round(x) - 6;
    if (e.state === 'eyes' || e.state === 'enter') { drawEyes(rk, bx, by, e.state === 'enter' ? DOWN : e.dir, false); return; }
    if (e.scared) {             // blue, and blinking white when the orb is about to wear off
      rk.draw('scared', bx, by, step, { flash: g.fright < 120 && g.fright % 24 < 12 });
      return;
    }
    const iced = g.freeze > 0 && !(g.freeze < 90 && g.freeze % 24 < 12);     // frozen solid: a white statue
    rk.draw(info.sprite, bx, by, iced ? 0 : step, { flash: iced });
    drawEyes(rk, bx, by, e.state === 'roam' ? e.dir : -1, info.oneEye);
  });
}

function drawPlayer(rk, g) {
  const p = g.player;
  if (g.phase === 'dying' && g.dieT >= 24) return;
  if (g.safe > 0 && g.safe % 10 >= 5) return;
  const at = spot(p);
  const name = 'chomp' + FACE[p.face];
  const frame = g.phase === 'play' && p.dir >= 0 ? [0, 1, 2, 1][(g.tick >> 2) & 3] : 1;
  const fading = (t) => t > 0 && !(t < 120 && t % 24 < 12);          // a power blinks out before it ends
  if (g.pw.turbo > 0 && g.phase === 'play') {                         // two fading copies behind
    for (const k of [6, 3]) {
      const old = p.trail[k];
      if (old) wrapped(old[0], (x) => rk.draw(name, x - 6, old[1] - 6, frame, { alpha: k === 6 ? 0.2 : 0.4 }));
    }
  }
  wrapped(at[0], (x) => {
    const y = at[1];
    rk.glow(x, y, g.pw.turbo > 0 ? 15 : 10, 'aqua', g.pw.turbo > 0 ? 0.4 : 0.25);
    if (fading(g.pw.magnet)) {                                        // a slow ring of amber points
      for (let n = 0; n < 12; n++) {
        const ang = n * Math.PI / 6 + g.tick * 0.05;
        rk.circle(x + Math.cos(ang) * MAGNET_REACH, y + Math.sin(ang) * MAGNET_REACH, 0.7, 'amber');
      }
    }
    rk.draw(name, x - 6, y - 6, frame, { flash: g.phase === 'dying' && g.dieT < 12 });
    if (fading(g.pw.laser)) {                                         // a lit muzzle
      rk.circle(x + DX[p.face] * 7, y + DY[p.face] * 7, 1.1, 'aqua-light');
      rk.glow(x + DX[p.face] * 7, y + DY[p.face] * 7, 5, 'aqua', 0.6);
    }
    if (fading(g.pw.shield)) {                                        // a ring round the chomper
      rk.glow(x, y, 16, 'aqua', 0.3);
      for (let n = 0; n < 16; n++) {
        const ang = n * Math.PI / 8 + g.tick * 0.08;
        rk.circle(x + Math.cos(ang) * 9, y + Math.sin(ang) * 9, 0.6, n % 2 ? 'aqua' : 'aqua-light');
      }
    }
  });
}

function drawMaze(rk, g) {
  drawFloor(rk, g.theme);
  rk.draw('maze' + g.stage, 0, 0);
  // Level clear: the walls blink pale twice a second
  if (g.phase === 'clear' && g.clearT % 30 < 15) rk.draw('maze' + g.stage, 0, 0, 0, { flash: true, alpha: 0.5 });
  rk.shape({ rect: [tx(EXIT.c) - 5, ty(EXIT.r + 1) - 1, 10, 2], r: 1, fill: 'chrome-300' });   // the pen door
  for (const i of g.maze.dots) {
    if (g.dots[i]) rk.circle(OX + (i % WRAP) * T + 5, OY + Math.floor(i / WRAP) * T + 5, 1.05, 'amber-light');
  }
  const pulse = Math.sin(g.tick * 0.12) * 2;
  for (const i of g.maze.orbs) {
    if (!g.dots[i]) continue;
    const x = tx(i % WRAP);
    const y = ty(Math.floor(i / WRAP));
    rk.glow(x, y, 9 + pulse, 'amber', 0.5);
    rk.draw('orb', x - 3, y - 3);
  }
  if (g.gem && !(g.gem.t < 120 && g.gem.t % 24 < 12)) {
    rk.glow(tx(BONUS.c), ty(BONUS.r), 11, 'amber', 0.45);
    rk.draw('gem', tx(BONUS.c) - 4, ty(BONUS.r) - 4 + (((g.tick >> 4) & 1) ? 0 : 1));
  }
  for (const cp of g.caps) {
    if (cp.t < 180 && cp.t % 24 < 12) continue;                      // blinks before it goes
    const x = tx(cp.c);
    const y = ty(cp.r) + (((g.tick >> 4) + cp.c) & 1);
    rk.glow(x, y, 10, 'amber', 0.45);
    rk.draw(POWERS[cp.kind].sprite, x - 4, y - 4);
  }
}

function drawBits(rk, g) {
  for (const b of g.bolts) {
    rk.glow(b.x, b.y, 7, 'aqua', 0.55);
    rk.shape({ rect: [b.x - (DX[b.dir] ? 3 : 1), b.y - (DY[b.dir] ? 3 : 1), DX[b.dir] ? 6 : 2, DY[b.dir] ? 6 : 2], r: 1, fill: 'aqua' });
    rk.circle(b.x + DX[b.dir] * 2, b.y + DY[b.dir] * 2, 1, 'chrome-100');
  }
  const at = spot(g.player);
  for (const pl of g.pulls) {   // a magnet's catch, flying in
    const k = pl.t / 8;
    rk.circle(pl.x + (at[0] - pl.x) * k, pl.y + (at[1] - pl.y) * k, 1.05, 'amber-light');
  }
  if (g.blast) {                // the bomb: a ring of sparks racing outwards
    const r = BLAST_REACH * g.blast.t / 14;
    rk.glow(g.blast.x, g.blast.y, r + 10, 'amber', 0.5 * (1 - g.blast.t / 14));
    for (let n = 0; n < 40; n++) {
      const ang = n * Math.PI / 20;
      rk.circle(g.blast.x + Math.cos(ang) * r, g.blast.y + Math.sin(ang) * r, 0.95, n % 2 ? 'amber' : 'sun-100');
    }
  }
  for (const pt of g.parts) rk.circle(pt.x + 0.5, pt.y + 0.5, 0.6, pt.colour, pt.life > 10 ? 1 : pt.life / 10);
}

/* ---------- The game ---------- */
RetroKit.game({
  id: 'chrome-chomp',
  title: 'CHROME CHOMP',
  tagline: 'A MAZE CHASE IN TWO MODES',
  lives: 3,
  livesIcon: 'dot',
  hud: ['score', { id: 'power', label: 'Power', type: 'meter', width: 120, full: 'Full' }, 'best', 'lives', 'level'],
  phoneMid: 'power',            // phones show three things: how long a power has left matters more than the level number
  keys: [['←', '→', '↑', '↓', 'Move'], ['Space', 'Fire'], ['P', 'Pause']],
  touch: 'Swipe to turn · Tap to fire',

  // The kit offers these after Start game, hands the chosen id to start() as rk.mode, and keeps a
  // high-score table for each.
  modes: [
    { id: 'classic', label: 'Classic', description: 'Power orbs turn the gremlins blue' },
    { id: 'advanced', label: 'Advanced', description: 'Adds capsules: laser, turbo and more' },
  ],
  music: { data: window.CHROME_CHOMP_MUSIC, level: 0.35 },    // level: how loud the track is against the sound effects (1 = the file's full level)

  sprites: buildSprites(),

  init(rk) {
    // Work out each maze once and draw its walls as a sprite, with its scenery
    mazes = MAZES.map(buildMaze);
    mazes.forEach((maze, i) => {
      const th = THEMES[i];
      rk.makeSprite(mazeArt(maze, th), 'maze' + i);
      const rnd = rng(i * 977 + 5);
      th.specks = [];
      for (let n = 0; n < (th.dust.length ? 44 : 0); n++) {
        th.specks.push({ x: Math.floor(rnd() * 320), y: Math.floor(rnd() * 180), colour: th.dust[n % th.dust.length] });
      }
    });
  },

  start(rk) {
    const g = {
      phase: 'ready',           // for each level: ready, play, and dying or clear
      advanced: rk.mode === 'advanced',
      level: 1,
      tick: 0,
      parts: [],
      cool: {},
      bolts: [],
      pulls: [],
      blast: null,
      player: null,
      note: false,
      lastKind: '',
      nextLife: 10000,          // an extra life at 10,000 points, then every 20,000 after
    };
    setupLevel(g, rk);
    return g;
  },

  update(g, rk) {
    g.tick++;
    for (const k in g.cool) if (g.cool[k] > 0) g.cool[k]--;
    for (const pt of g.parts) { pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.93; pt.vy *= 0.93; pt.life--; }
    g.parts = g.parts.filter((pt) => pt.life > 0);
    for (const pl of g.pulls) pl.t++;
    g.pulls = g.pulls.filter((pl) => pl.t < 8);
    if (g.blast && ++g.blast.t > 14) g.blast = null;
    if (rk.ending) return;               // game over is on its way: no more control

    const p = g.player;
    const d = readTurn(g, rk);
    if (d >= 0) p.want = d;              // a turn asked for during a pause still counts
    if (g.phase === 'dying') { stepDying(g, rk); return; }
    if (g.phase === 'clear') { g.clearT++; return; }
    if (g.phase !== 'play') return;
    if (g.hold > 0) { g.hold--; return; }             // a beat of stillness when a gremlin is eaten

    if (rk.score >= g.nextLife) {
      g.nextLife += 20000;
      rk.addLife(1);
      const here = spot(p);
      rk.popup('1UP', here[0], here[1] - 10, 'amber');
    }

    g.lifeT++;
    stepPlayer(g, rk);
    const at = spot(p);
    stepPowers(g, rk, at[0], at[1]);
    if (g.advanced) stepCapsules(g, rk, at[0], at[1]);
    if (g.gem) {
      if (gap(at[0], at[1], tx(BONUS.c), ty(BONUS.r)) < TOUCH) {
        rk.addScore(GEM_POINTS[Math.min(g.level, GEM_POINTS.length) - 1], tx(BONUS.c), ty(BONUS.r) - 8, 'amber');
        rk.sfx('pickup');
        g.gem = null;
      } else if (--g.gem.t <= 0) g.gem = null;
    }

    // Every light eaten: on to the next maze
    if (g.left <= 0) {
      g.phase = 'clear';
      g.clearT = 0;
      g.bolts = [];
      rk.sfx('pickup');
      rk.hud.set('power', 0);
      rk.after(1.6, () => { g.level++; setupLevel(g, rk); });
      return;
    }

    // The gremlins' clocks: blue time, frozen time, and their turns at drifting and hunting
    if (g.freeze > 0) g.freeze--;
    else if (g.fright > 0) {
      if (--g.fright === 0) for (const e of g.foes) e.scared = false;
    } else if (g.wave < g.tune.waves.length && --g.waveT <= 0) {
      g.wave++;
      g.drift = g.wave % 2 === 0 && g.wave < g.tune.waves.length;
      g.waveT = g.tune.waves[g.wave] || 0;
      for (const e of g.foes) if (e.state === 'roam') e.turn = true;
    }
    if (g.safe > 0) g.safe--;
    for (const e of g.foes) stepFoe(g, rk, e);

    // Touching a gremlin
    for (const e of g.foes) {
      if (e.state !== 'roam') continue;
      const ep = spot(e);
      if (gap(at[0], at[1], ep[0], ep[1]) >= TOUCH) continue;
      if (e.scared) {                    // eaten: 200, then 400, 800, 1600 from the same orb
        catchFoe(g, rk, e, 200 << Math.min(g.chain, 3), false);
        g.chain++;
        g.hold = 18;
      } else if (g.freeze > 0 || g.safe > 0) continue;
      else if (g.pw.shield > 0) {        // the shield takes the hit, and the gremlin with it
        g.pw.shield = 0;
        g.safe = 45;
        rk.sfx('hit');
        catchFoe(g, rk, e, 200, true);
      } else { die(g, rk); return; }
    }

    // The Power meter: how much is left of whichever power has longest to run
    let most = g.fright / g.frightMax;
    most = Math.max(most, g.freeze / FREEZE_TIME);
    for (const k in g.pw) most = Math.max(most, g.pw[k] / POWERS[k].time);
    rk.hud.set('power', Math.ceil(most * 40) / 40);
  },

  draw(ctx, g, rk) {
    drawMaze(rk, g);
    if (g.phase !== 'clear' && !(g.phase === 'dying' && g.dieT >= 24)) for (const e of g.foes) drawFoe(rk, g, e);
    drawPlayer(rk, g);
    drawBits(rk, g);
  },

  // The title screen: the kit's sunset, with the chomper and a gremlin along the bottom, clear of the logo.
  drawTitle(ctx, rk) {
    rk.backdrop.dusk();
    rk.draw('chompR', 20, 153, [0, 1, 2, 1][Math.floor(rk.t * 6) & 3]);
    for (const x of [40, 49, 58]) rk.circle(x + 1, 159, 1.05, 'amber-light');     // kept left of the menu on a phone
    rk.draw('imp', 284, 153, Math.floor(rk.t * 4) & 1);
    drawEyes(rk, 284, 153, LEFT, false);
  },
});
</script>
