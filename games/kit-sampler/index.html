<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Kit Sampler</title><!-- the kit replaces this with the game's title -->
<!-- The kit. build.py copies both files (and the fonts) into dist/<game>.html. Keep data-rk-inline. -->
<link rel="stylesheet" href="../../kit/retro-kit.css" data-rk-inline>
<script src="../../kit/retro-kit.js" data-rk-inline></script>
</head>
<body>
<script>
/* KIT SAMPLER — not a game: the Retro Kit's test page. It shows every drawing part of the kit on one
   screen at a time, with a frame-rate readout, so a change to the kit can be checked by eye on a monitor
   and on a phone before any game is rebuilt.
   Scenes: Dusk (backdrop, blocks, paddle, ball), Space (backdrop, a fleet, ship, shots, shelters, two of
   them shot at),
   Parts (every primitive and shape type), Stress (300 moving sprites, for the frame rate).
   Left / right or 1-4 change scene; on a phone, tap. */

const SCENES = ['Dusk', 'Space', 'Parts', 'Stress'];

/* ---------- Shape art (sample characters, invented for this page) ---------- */
const SHIP = {
  size: [20, 12],
  shapes: [
    { poly: [10, 0, 13, 6, 20, 9.5, 20, 11, 12.5, 10, 10, 12, 7.5, 10, 0, 11, 0, 9.5, 7, 6], fill: 'chrome' },
    { poly: [10, 2.6, 11.7, 6.6, 10, 8.2, 8.3, 6.6], fill: 'aqua', band: [0.35, 0.75] },
  ],
};

/* A one-eyed jelly: a dome, an eye, three legs that swing between two frames */
function jelly(ramp) {
  const body = [
    { path: 'M0.8 6.6 C0.8 2.4 3.2 0 6 0 C8.8 0 11.2 2.4 11.2 6.6 Z', fill: ramp, band: [0.25, 0.72] },
    { circle: [6, 3.5, 2], fill: 'chrome-100' },
    { circle: [6.3, 3.6, 0.95], fill: 'ink' },
  ];
  const legs = (s) => [
    { line: [2.4, 6.2, 1.6 + s, 8.6], width: 1.1, fill: ramp + '-dark' },
    { line: [6, 6.2, 6 - s * 0.5, 8.8], width: 1.1, fill: ramp + '-dark' },
    { line: [9.6, 6.2, 10.4 - s, 8.6], width: 1.1, fill: ramp + '-dark' },
  ];
  return { size: [12, 9], frames: [[...legs(0.9), ...body], [...legs(-0.7), ...body]] };
}

/* A horned beetle: a wide shell, two horns, two eyes */
function beetle(ramp) {
  const shell = [
    { poly: [1, 2.2, 0, 0, 3, 1.4], fill: ramp + '-light' },
    { poly: [11, 2.2, 12, 0, 9, 1.4], fill: ramp + '-light' },
    { rect: [0.6, 1.4, 10.8, 5.4], r: 2.4, fill: ramp, band: [0.3, 0.68] },
    { circle: [4, 3.9, 1.05], fill: 'chrome-100' }, { circle: [8, 3.9, 1.05], fill: 'chrome-100' },
    { circle: [4.2, 4, 0.5], fill: 'ink' }, { circle: [8.2, 4, 0.5], fill: 'ink' },
  ];
  const feet = (s) => [
    { line: [2, 6.4, 0.8 - s, 8.4], width: 1, fill: ramp + '-dark' },
    { line: [10, 6.4, 11.2 + s, 8.4], width: 1, fill: ramp + '-dark' },
  ];
  return { size: [12, 9], frames: [[...feet(0), ...shell], [...feet(0.7), ...shell]] };
}

/* A visor drone: a helmet with a lit slot */
function drone(ramp) {
  const top = [
    { path: 'M0.6 6 C0.6 2.2 3 0.4 6 0.4 C9 0.4 11.4 2.2 11.4 6 L10.4 7.6 L1.6 7.6 Z', fill: ramp, band: [0.3, 0.74] },
    { rect: [2.2, 3.4, 7.6, 1.6], r: 0.8, fill: 'ink' },
  ];
  const eye = (x) => [{ rect: [x, 3.75, 2.2, 0.9], r: 0.45, fill: 'aqua-light' }];
  return { size: [12, 9], frames: [[...top, ...eye(3)], [...top, ...eye(6.8)]] };
}

const SPRITES = {
  ship: SHIP,
  jellyRed: jelly('red'),
  beetleHeat: beetle('heat'),
  droneAmber: drone('amber'),
  ball: { size: [5, 5], shapes: [{ circle: [2.5, 2.5, 2.5], fill: 'chrome', dir: 'diag', band: [0.38, 0.72] }] },
  paddle: {
    size: [36, 6],
    shapes: [
      { rect: [2, 0.4, 32, 5.2], r: 2.6, fill: 'chrome', band: [0.36, 0.7] },
      { rect: [10, 2.4, 16, 1.2], r: 0.6, fill: 'aqua' },
      { circle: [3, 3, 3], fill: 'aqua', dir: 'diag' },
      { circle: [33, 3, 3], fill: 'aqua', dir: 'diag' },
    ],
  },
  shelter: {
    size: [24, 12],
    shapes: [{ path: 'M0 12 L0 4 Q0 0 4 0 L20 0 Q24 0 24 4 L24 12 L17 12 L17 9 Q17 6 12 6 Q7 6 7 9 L7 12 Z', fill: 'chrome', band: [0.34, 0.66] }],
  },
  shot: { size: [2, 6], outline: 0.4, shapes: [{ rect: [0, 0, 2, 6], r: 1, fill: 'aqua-light' }] },
  bomb: { size: [2.4, 6], outline: 0.4, shapes: [{ rect: [0, 0, 2.4, 6], r: 1.2, fill: 'red', band: [0.3, 0.7] }] },
  flame: { size: [4, 5], outline: false, shapes: [{ path: 'M0 0 L4 0 L2 5 Z', fill: ['aqua-light', 0.4, 'aqua'], alpha: 0.85 }] },
};

const FLEET = [['jellyRed', 0], ['beetleHeat', 1], ['droneAmber', 2], ['droneAmber', 3]];

function makeStress(rk) {
  const list = [];
  const kinds = ['jellyRed', 'beetleHeat', 'droneAmber', 'ship', 'ball'];
  for (let i = 0; i < 300; i++) {
    list.push({ k: kinds[i % kinds.length], x: rk.rand(0, 308), y: rk.rand(0, 168), vx: rk.rand(-1.2, 1.2), vy: rk.rand(-1, 1) });
  }
  return list;
}

RetroKit.game({
  id: 'kit-sampler',
  title: 'KIT SAMPLER',
  tagline: 'RETRO KIT 2.1 TEST PAGE',
  lives: 1,
  hud: [{ id: 'scene', label: 'Scene', type: 'text', value: 'Dusk' }, { id: 'fps', label: 'Frames/s', type: 'num' }, { id: 'res', label: 'Canvas', type: 'text' }],
  phoneMid: 'scene',
  keys: [['←', '→', 'Scene'], ['1', '4', 'Jump to'], ['P', 'Pause']],
  touch: 'Tap to change scene',
  sprites: SPRITES,

  start(rk) {
    return { scene: 0, t: 0, ballX: 150, ballY: 120, vx: 1.3, vy: -1.1, stress: makeStress(rk), fps: 60, last: 0, frames: 0, acc: 0 };
  },

  update(g, rk) {
    g.t++;
    const n = SCENES.length;
    if (rk.input.pressed.right || rk.input.tap) g.scene = (g.scene + 1) % n;
    if (rk.input.pressed.left) g.scene = (g.scene + n - 1) % n;
    for (let i = 0; i < n; i++) if (rk.input.keyPressed('Digit' + (i + 1))) g.scene = i;
    rk.hud.set('scene', SCENES[g.scene]);
    /* the ball bounces inside the lower half of the dusk scene */
    g.ballX += g.vx; g.ballY += g.vy;
    if (g.ballX < 8 || g.ballX > 307) g.vx = -g.vx;
    if (g.ballY < 70 || g.ballY > 150) g.vy = -g.vy;
    if (g.scene === 3) {
      for (const s of g.stress) {
        s.x += s.vx; s.y += s.vy;
        if (s.x < 0 || s.x > 308) s.vx = -s.vx;
        if (s.y < 0 || s.y > 170) s.vy = -s.vy;
      }
    }
  },

  draw(ctx, g, rk) {
    /* frame rate, averaged over half a second of real time */
    const now = performance.now();
    if (g.last) { g.acc += now - g.last; g.frames++; }
    g.last = now;
    if (g.acc > 500) {
      rk.hud.set('fps', Math.round(g.frames * 1000 / g.acc));
      rk.hud.set('res', ctx.canvas.width + '×' + ctx.canvas.height);
      g.acc = 0; g.frames = 0;
    }
    const t = g.t;
    const scene = SCENES[g.scene];

    if (scene === 'Dusk') {
      rk.backdrop.dusk({ scroll: t * 0.5 });
      const ramps = ['chrome', 'red', 'heat', 'amber', 'aqua'];
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 10; col++) {
          if (row === 4 && (col === 4 || col === 5)) continue;
          rk.block(11 + col * 30, 16 + row * 10, 28, 8, ramps[row]);
        }
      }
      const px = 142 + Math.sin(t / 50) * 90;
      rk.draw('paddle', px, 156);
      rk.glow(px + 18, 159, 22, 'aqua', 0.25);
      rk.draw('ball', g.ballX, g.ballY);
      rk.glow(g.ballX + 2.5, g.ballY + 2.5, 12, 'chrome-100', 0.4);
      return;
    }

    if (scene === 'Space' || scene === 'Stress') {
      rk.backdrop.space({ scroll: t * 0.6, terrain: scene === 'Space' });
    }

    if (scene === 'Space') {
      const march = Math.sin(t / 90) * 16;
      const step = (t >> 5) & 1;
      for (const [name, row] of FLEET) {
        for (let col = 0; col < 9; col++) {
          const x = 60 + march + col * 20, y = 24 + row * 13;
          rk.draw(name, x, y, step, { flash: row === 0 && col === 4 && (t % 60) < 6 });
        }
      }
      for (let i = 0; i < 4; i++) rk.draw('shelter', 28 + i * 80, 128, 0, i % 2 ? { cut: [[5, 1.5, 1.6], [7, 2.5, 1.6], [19, 7, 1.6]] } : null);   // odd ones shot at
      const shipX = 150 + Math.sin(t / 70) * 110;
      rk.draw('flame', shipX + 8, 168 + ((t >> 2) & 1) * 0.5);
      rk.draw('ship', shipX, 157);
      rk.glow(shipX + 10, 170, 10, 'aqua', 0.4);
      const shotY = 150 - (t * 3) % 140;
      rk.draw('shot', 160, shotY);
      rk.glow(161, shotY + 3, 7, 'aqua', 0.5);
      const bombY = 60 + (t * 1.4) % 90;
      rk.draw('bomb', 116, bombY);
      rk.glow(117, bombY + 3, 6, 'red', 0.35);
      rk.draw('beetleHeat', 286, 6, step, { flip: true });
      return;
    }

    if (scene === 'Parts') {
      rk.rect(0, 0, 320, 180, 'sky-0');
      rk.rect(0, 120, 320, 60, 'sky-1');
      /* row 1: flat boxes and dots */
      const toks = ['chrome-100', 'chrome-300', 'aqua', 'red', 'heat', 'amber', 'sun-100', 'hill-near'];
      toks.forEach((c, i) => rk.rect(10 + i * 14, 10, 10, 10, c));
      toks.forEach((c, i) => rk.circle(130 + i * 12, 15, 4.5, c));
      for (let i = 0; i < 8; i++) rk.px(232 + i * 3, 14, 'chrome-100');
      /* row 2: blocks in every ramp, three sizes */
      ['chrome', 'red', 'heat', 'amber', 'aqua'].forEach((r, i) => {
        rk.block(10 + i * 34, 28, 28, 8, r);
        rk.block(190 + i * 26, 28, 20, 14, r);
      });
      /* row 3: one shape of each kind, banded, drawn straight with rk.shape */
      rk.shape({ circle: [24, 66, 14], fill: ['sun-100', 0.18, 'amber', 0.5, 'heat', 0.78, 'red'] });
      rk.shape({ circle: [60, 66, 14], fill: 'aqua', dir: 'diag' });
      rk.shape({ ellipse: [100, 66, 16, 9, -15], fill: 'amber' });
      rk.shape({ rect: [124, 54, 30, 24], r: 4, fill: 'chrome' });
      rk.shape({ poly: [160, 78, 175, 52, 190, 78], fill: 'heat', dir: 'right' });
      rk.shape({ line: [198, 76, 210, 56, 222, 76, 234, 56], width: 3, fill: 'aqua-light' });
      rk.shape({ path: 'M244 78 C244 56 274 56 274 78 Z', fill: 'red' });
      rk.shape({ circle: [296, 66, 14], fill: 'chrome', band: false });
      rk.shape({ circle: [296, 66, 10], stroke: 1.2, fill: 'aqua-light' });
      /* row 4: the sample characters, normal, flash, flipped, and drifting by fractions of a pixel */
      const names = ['ship', 'jellyRed', 'beetleHeat', 'droneAmber', 'ball', 'shelter'];
      names.forEach((n, i) => {
        rk.draw(n, 12 + i * 34, 96, (t >> 5) & 1);
        rk.draw(n, 12 + i * 34, 140, 0, { flash: true });
      });
      const drift = (t * 0.13) % 60;
      rk.draw('ship', 214 + drift, 96);
      rk.draw('jellyRed', 214 + drift, 140, (t >> 5) & 1, { flip: true });
      return;
    }

    /* Stress: 300 moving sprites with glows, plus a wall of blocks */
    for (let i = 0; i < 40; i++) rk.block(4 + (i % 10) * 31, 140 + Math.floor(i / 10) * 9, 29, 7, ['red', 'heat', 'amber', 'aqua'][i % 4]);
    const step = (t >> 4) & 1;
    g.stress.forEach((s, i) => {
      rk.draw(s.k, s.x, s.y, step);
      if (i % 10 === 0) rk.glow(s.x + 6, s.y + 4, 8, 'aqua', 0.3);
    });
  },
});
</script>
</body>
</html>
