<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Nights Sampler</title><!-- the kit replaces this with the game's title -->
<!-- The kit. build.py copies both files, the fonts and their licences into dist/<game>.html. Keep data-cn-inline. -->
<link rel="stylesheet" href="../../kit/city-nights.css" data-cn-inline>
<script src="../../kit/city-nights.js" data-cn-inline></script>
<style>
/* the test page's readout, top left over the picture, on the kit's dark plaque */
.cs-readout{position:absolute;top:var(--space-6);left:var(--space-6);display:block;max-width:min(430px,calc(100% - 160px));padding:8px 12px;font:500 13px/18px var(--font-ui);pointer-events:none}
.cn-touch .cs-readout{top:calc(var(--edge-phone) + env(safe-area-inset-top,0px));left:calc(var(--edge-phone) + env(safe-area-inset-left,0px));font-size:12px;line-height:16px;padding:6px 10px}
.cs-readout b{font-weight:600;color:var(--night-text)}
.cs-readout div+div{margin-top:2px}
</style>
</head>
<body>
<script>
/* CITY NIGHTS SAMPLER — not a game: the City Nights kit's test page. It shows every drawing part of the kit, one
   scene at a time, with a frame-rate readout, so a change to the kit can be checked by eye on a computer and on a
   phone before any game is rebuilt. Every screen is reached the usual way: the title, pause and settings (Esc),
   and game over, initials and high scores when Drive's TIME runs out.
   Scenes: 1 Drive (the four districts, traffic, the meter and caption, steering and braking; N jumps to the next
   district, F drives fast), 2 Mong Kok (the speed check: the speed test's measurement, run by itself, then again with
   a crash pop lit and with street pieces), 3 Power-ups (all five), 4 Crash (each vehicle, and each crash pop word in
   turn, then a random one), 5 Vehicles (every vehicle and colour), 6 Street (the obstacles, the animals bolting, the
   passengers and the stop bays), 7 Long street (each district in turn from its edge, at 84 km/h, timing the frames
   while the street is made a piece at a time, with the graphics memory and the opening times).
   Keys 1-7 change scene; on a phone, tap for the next one. */

const SCENES = ['Drive', 'Mong Kok', 'Power-ups', 'Crash', 'Vehicles', 'Street', 'Long street'];
const NOTES = [
  'All four districts, traffic, the meter and the caption. ← → steer, ↓ brakes, N jumps to the next district, hold F to drive fast. TIME runs out at 00 and the run ends.',
  '',
  'The five power-ups hovering over the road, near and far.',
  'The taxi runs into each vehicle in turn: the crash pop and the brake lights.',
  'Every vehicle in every colour, keeping pace with the taxi.',
  'Roadworks, oil, spilt cargo and a pothole; the four animals, each bolting as the taxi comes; a passenger at the pick-up bay, then the drop-off bay. ↓ slows down.',
  ''
];
// Long street: each district in turn, from TOUR_LEAD metres before its edge, for TOUR_TIME seconds at TOUR_SPEED (84 km/h, 快's speed)
const TOUR_LEAD = 40, TOUR_TIME = 15, TOUR_SPEED = 84 / 3.6;
const FAST = 100;   // Drive, F held: metres a second
// Street, laid out ahead of the taxi each lap: obstacles [kind, metres ahead, lane (0 left, 1 middle, 2 right)], animals in
// the middle lane [kind, metres ahead, the way they face and bolt], then the pick-up bay and, once it is passed, the drop-off bay
const STREET = [['roadworks', 26, 0], ['oil', 40, 1], ['cargo', 50, 2], ['pothole', 62, 1]];
const ANIMALS = [['boar', 76, 1], ['dog', 90, -1], ['cat', 102, 1], ['chickens', 114, -1]];
const STOPS = [['pickup', 126], ['dropoff', 156]];
const PASSENGERS = [['plain', 'plain'], ['case', 'with a suitcase'], ['bags', 'with shopping']];   // one kind each lap
const BOLT_AT = 26;   // metres between the taxi and an animal when it bolts
// the speed check's third run: pieces kept this many metres ahead of the taxi as it drives, all on screen at once
const CHECK_PIECES = { obstacles: [['roadworks', 30, 0], ['oil', 34, 1], ['cargo', 40, 2], ['pothole', 52, 1]], animals: [['chickens', 46, -0.2], ['boar', 58, 0.3]], stop: 20 };
// Crash: the words in turn, then one the kit picks at random; C, S, B and R choose the next
const POPS = [['crash', 'CRASH!', 'KeyC'], ['smash', 'SMASH!', 'KeyS'], ['bang', 'BANG!', 'KeyB'], ['random', 'a random one', 'KeyR']];
const TOKENS = ['time', 'fare', 'speed', 'shield', 'double'];
const LINEUP = [   // Vehicles: metres ahead of the taxi, lane (0 left, 1 middle, 2 right), kind, colour; staggered so none hides another
  [8, 0, 'sedan', 0], [8, 2, 'sedan', 1], [14, 1, 'taxi', 0],
  [19, 0, 'van', 0], [19, 2, 'van', 1], [25, 1, 'sedan', 2],
  [30, 0, 'minibus', 0], [30, 2, 'minibus', 1], [37, 1, 'van', 2]
];
const CRASHERS = [['taxi', 0], ['sedan', 1], ['van', 2], ['minibus', 0]];
const mongKok = (cn) => cn.street.districts[3].z + 0.5;   // metres: just inside Mong Kok, where the speed test began

/* The speed check, as the speed test ran it: the street drives through Mong Kok at 68 km/h and every gap between
   frames is recorded (the frame rate); then each frame is drawn eight times over, seven of them off screen, so the
   device can't keep up with the screen, and the gap divided by eight is the time to draw one frame. Then the same
   again with a crash pop lit all the while (a new one each second), and again with street pieces on screen, to show
   what each costs. */
const LOADN = 8;
const CHECK = [   // the parts in order and how long each lasts in seconds; run 0 is the street alone, 1 with a crash pop, 2 with pieces
  { name: 'settle', t: 0.7, run: 0 }, { name: 'fps', t: 3.5, run: 0 }, { name: 'rest', t: 0.4, run: 0 }, { name: 'load', t: 2.5, run: 0 },
  { name: 'rest', t: 0.6, run: 1 }, { name: 'fps', t: 3.5, run: 1 }, { name: 'rest', t: 0.4, run: 1 }, { name: 'load', t: 2.5, run: 1 },
  { name: 'rest', t: 0.6, run: 2 }, { name: 'fps', t: 3.5, run: 2 }, { name: 'rest', t: 0.4, run: 2 }, { name: 'load', t: 2.5, run: 2 }
];
const RUN_NAMES = ['', ', with a crash pop lit', ', with street pieces'];
const fmt = (v, d = 0) => (Number.isFinite(v) ? v.toFixed(d) : '–');
const median = (a) => { if (!a.length) return NaN; const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
const pct = (a, p) => { if (!a.length) return NaN; const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };
function browserName() {
  const u = navigator.userAgent, m = (re) => re.exec(u);
  const b = m(/Edg\/(\d+)/) ? 'Edge ' + m(/Edg\/(\d+)/)[1] : m(/CriOS\/(\d+)/) ? 'Chrome ' + m(/CriOS\/(\d+)/)[1] : m(/Chrome\/(\d+)/) ? 'Chrome ' + m(/Chrome\/(\d+)/)[1]
    : m(/Firefox\/(\d+)/) ? 'Firefox ' + m(/Firefox\/(\d+)/)[1] : m(/Version\/([\d.]+).*Safari/) ? 'Safari ' + m(/Version\/([\d.]+)/)[1] : 'a browser';
  const os = m(/Android [\d.]+/) ? m(/Android [\d.]+/)[0] : /iPhone|iPad/.test(u) ? 'iOS' : /Windows NT/.test(u) ? 'Windows' : /Mac OS X/.test(u) ? 'macOS' : /CrOS/.test(u) ? 'ChromeOS' : /Linux/.test(u) ? 'Linux' : '';
  return b + (os ? ' on ' + os : '');
}

let readout = null;   // the plaque's three lines

CityNights.game({
  id: 'cn-sampler',
  title: ['City Nights', 'Sampler'],
  zh: '的士',
  keys: [['1', '7', 'Scene'], ['←', '→', 'Steer'], ['↓', 'Brake'], ['Esc', 'Pause']],
  touch: 'Drag to steer · Tap for the next scene',

  start(cn) {
    // the readout goes on the play layer, which the kit makes afresh for each run
    const box = document.createElement('div');
    box.className = 'cn-plaque cs-readout';
    readout = [0, 1, 2, 3].map(() => box.appendChild(document.createElement('div')));
    document.querySelector('.cn-play').append(box);
    const g = { scene: -1, time: 60, traffic: cn.street.traffic(12), crash: { i: 0, wait: 0, pop: 0 }, check: null, result: null, tour: null, last: 0, shown: '' };
    setScene(g, cn, 0);
    return g;
  },

  update(g, cn) {
    const taxi = cn.street.taxi, dt = 1 / 60, n = SCENES.length;
    for (let i = 0; i < n; i++) if (cn.input.keyPressed('Digit' + (i + 1)) || cn.input.keyPressed('Numpad' + (i + 1))) setScene(g, cn, i);
    if (cn.input.tap) setScene(g, cn, (g.scene + 1) % n);
    // steering, in every scene
    if (cn.input.left) taxi.x -= 1.4 * dt;
    if (cn.input.right) taxi.x += 1.4 * dt;
    if (cn.input.pointer.down) taxi.x += cn.input.pointer.dx / cn.W * 2;
    taxi.x = cn.clamp(taxi.x, -0.85, 0.85);

    // the taxi's speed, then it moves, then what the scene puts round it
    const scene = SCENES[g.scene], c = g.crash;
    taxi.speed = scene === 'Drive' ? (cn.input.down ? 4 : cn.input.key('KeyF') ? FAST : 16) : scene === 'Mong Kok' ? (cn.input.down ? 4 : 19)
      : scene === 'Power-ups' ? 5 : scene === 'Vehicles' ? 6 : scene === 'Street' ? (cn.input.down ? 3 : 8)
      : scene === 'Long street' ? TOUR_SPEED : c.wait > 0 ? 0 : Math.min(12, taxi.speed + 8 * dt);
    taxi.z += taxi.speed * dt;
    if (scene === 'Drive' || scene === 'Mong Kok' || scene === 'Long street') {
      for (const car of cn.street.cars) car.z += car.speed * dt;
      cn.street.recycle(cn.street.cars);
      if (scene === 'Drive') {
        // N: to just before the next district's edge
        if (cn.input.keyPressed('KeyN')) {
          const d = cn.street.districts[(cn.street.district(taxi.z).index + 1) % 4];
          jumpTo(cn, d.z - TOUR_LEAD);
        }
        g.time = Math.max(0, g.time - dt);
        cn.meter.time = g.time;
        if (g.time === 0 && !cn.ending) cn.gameOver();
      } else if (scene === 'Long street') {
        const t = g.tour;
        t.t += dt;
        if (t.t >= TOUR_TIME) {
          t.k++; t.t = 0;
          if (t.k === 4) { t.result = tourResult(t, cn); t.k = 0; t.gaps = []; t.made = cn.picture.opening; }
          jumpTo(cn, cn.street.districts[t.k].z - TOUR_LEAD);
          t.skip = true;   // the frame after a jump makes new pieces at once: not counted
        }
      }
    } else if (scene === 'Power-ups') {
      cn.street.tokens.forEach((t, i) => { t.z = taxi.z + (i < 5 ? 12 : 24); });
    } else if (scene === 'Vehicles') {
      cn.street.cars.forEach((car, i) => { car.z = taxi.z + LINEUP[i][0]; });
    } else if (scene === 'Street') {
      // each animal bolts the way it faces as the taxi comes; past a bay, the next one, and after the drop-off a new lap
      for (const an of cn.street.animals) if (!an.bolt && cn.street.gap(taxi.z, an.z) < BOLT_AT) an.bolt = an.face;
      const bay = cn.street.stop;
      if (bay && cn.street.gap(taxi.z, bay.z + 10) > cn.street.length / 2) {
        if (g.lay.stop === 0) setStop(g, cn, 1); else layStreet(g, cn, g.lay.lap + 1);
      }
    } else {
      POPS.forEach((p, i) => { if (cn.input.keyPressed(p[2])) c.pop = i; });
      if (c.wait > 0) {
        c.wait -= dt;
        if (c.wait <= 0) { c.i = (c.i + 1) % CRASHERS.length; placeCrasher(g, cn); }
        return;
      }
      // the taxi's front against the vehicle's rear (z is a vehicle's rear), and whether they overlap side to side
      const car = cn.street.cars[0], L = cn.street.size('taxi'), S = cn.street.size(car.kind);
      const ahead = cn.street.gap(taxi.z + L.length, car.z);
      const side = Math.abs(taxi.x - car.x) * cn.street.width / 2 < (L.width + S.width) / 2;
      const reached = ahead < 0.2 || ahead > cn.street.length - S.length;
      if (reached && side) {
        cn.picture.nextPop = POPS[c.pop][0];   // 'random' is no word, so the kit picks
        c.pop = (c.pop + 1) % POPS.length;
        cn.street.crash(car.z, (taxi.x + car.x) / 2);
        cn.sfx('hit');
        c.wait = 1.2;
      } else if (reached) placeCrasher(g, cn);   // steered past it
    }
    if (scene !== 'Crash') cn.addFare(taxi.speed * dt * 0.02);
  },

  // called once a frame during play: the speed check's timing and the readout
  draw(g, cn) {
    const now = performance.now(), real = g.last ? (now - g.last) / 1000 : 0;
    g.last = now;
    if (g.check) runCheck(g, cn, real);
    if (g.tour && SCENES[g.scene] === 'Long street') { if (g.tour.skip > 0) g.tour.skip--; else if (real > 0) g.tour.gaps.push(real * 1000); }
    showReadout(g, cn);
  }
});

function setScene(g, cn, i) {
  const st = cn.street, taxi = st.taxi;
  if (g.check) stopCheck(g, cn);
  g.scene = i;
  g.result = null;
  g.tour = null;
  st.tokens = [];
  clearPieces(cn);
  cn.meter.time = null;
  const scene = SCENES[i];
  if (scene === 'Drive' || scene === 'Mong Kok') {
    st.cars = g.traffic;
    if (scene === 'Mong Kok') {
      // i: the part of CHECK under way (-1 while waiting for Automatic); runs: the frames of each run
      g.check = { i: -1, t: 0, prev: null, popT: 0, runs: [0, 1, 2].map(() => ({ fps: [], load: [] })) };
      jumpTo(cn, mongKok(cn));
    }
  } else if (scene === 'Long street') {
    // k: the district under way; gaps: the time between frames (ms); made: the pieces count when the tour began
    st.cars = g.traffic;
    g.tour = { k: 0, t: 0, gaps: [], skip: 2, result: null, made: cn.picture.opening };
    jumpTo(cn, st.districts[0].z - TOUR_LEAD);
  } else if (scene === 'Power-ups') {
    st.tokens = TOKENS.map((k, n) => ({ z: 0, x: -0.8 + n * 0.4, kind: k })).concat(TOKENS.map((k, n) => ({ z: 0, x: 0.6 - n * 0.3, kind: k })));
  } else if (scene === 'Crash') {
    taxi.x = 0;
    g.crash = { i: 0, wait: 0, pop: 0 };
    placeCrasher(g, cn);
  } else if (scene === 'Street') {
    st.cars = [];
    layStreet(g, cn, 0);
  } else {
    st.cars = LINEUP.map((v) => ({ z: 0, x: st.lanes[v[1]], kind: v[2], tone: v[3] }));
  }
}
function clearPieces(cn) {
  cn.street.obstacles = [];
  cn.street.animals = [];
  cn.street.stop = null;
}
// Street: a lap's pieces, laid out ahead of the taxi
function layStreet(g, cn, lap) {
  const st = cn.street, z = st.taxi.z;
  g.lay = { z, lap, stop: 0 };
  st.obstacles = STREET.map(([kind, d, lane]) => ({ kind, z: z + d, x: st.lanes[lane] }));
  st.animals = ANIMALS.map(([kind, d, dir]) => ({ kind, z: z + d, x: 0, face: dir }));
  setStop(g, cn, 0);
}
function setStop(g, cn, i) {
  const [kind, d] = STOPS[i];
  g.lay.stop = i;
  cn.street.stop = { kind, z: g.lay.z + d, passenger: kind === 'pickup' ? PASSENGERS[g.lay.lap % PASSENGERS.length][0] : null, waiting: true };
}
// moves the taxi to z (metres), taking the traffic with it so the street ahead looks the same
function jumpTo(cn, z) {
  const st = cn.street, d = z - st.taxi.z;
  st.place({ z });
  for (const car of st.cars) car.z += d;
}
// Long street: the frames over all four districts, and the pieces of street made meanwhile
function tourResult(t, cn) {
  const tot = t.gaps.reduce((a, b) => a + b, 0), o = cn.picture.opening, n = o.pieces - t.made.pieces;
  return 'All four districts at 84 km/h: <b>' + fmt(t.gaps.length / (tot / 1000)) + ' fps</b>; slowest 1 in 20 came ' + fmt(pct(t.gaps, 0.95)) +
    ' ms apart, the slowest of all ' + fmt(Math.max.apply(null, t.gaps)) + ' ms. ' + n + ' pieces of street made, ' + fmt((o.pieceMs - t.made.pieceMs) / Math.max(1, n), 1) + ' ms each.';
}
// the graphics memory the kit counts, and how long the street took to build when the page opened
function memLine(cn) {
  const m = cn.picture.memory, o = cn.picture.opening;
  return 'Graphics memory <b>' + fmt(m.buffers + m.textures + m.renderbuffers) + ' MB</b>: street shapes ' + fmt(m.street, 1) + ', other buffers ' + fmt(m.buffers - m.street, 1) +
    ', textures ' + fmt(m.textures) + ', picture buffers ' + fmt(m.renderbuffers) + ' · Opening: street built in <b>' + fmt(o.build) + ' ms</b> (planning it ' + fmt(o.plan) + ' ms, its first pieces ' + fmt(o.first) + ' ms), Start game worked at ' +
    fmt(o.ready / 1000, 2) + ' s, first picture at ' + fmt(o.shown / 1000, 2) + ' s';
}
function placeCrasher(g, cn) {
  const v = CRASHERS[g.crash.i];
  cn.street.cars = [{ z: cn.street.taxi.z + 30, x: cn.street.lanes[1], kind: v[0], tone: v[1] }];
}

/* ----- the speed check ----- */
function runCheck(g, cn, real) {
  const c = g.check;
  if (cn.screen !== 'play') { stopCheck(g, cn, 'The check stopped when the game paused. Press 2 to run it again.'); return; }
  if (c.i < 0) {
    // Automatic times the first seconds of play first; the check starts from the edge of Mong Kok once it has
    if (cn.picture.deciding) return;
    c.i = 0;
    c.prev = CHECK[0];
    jumpTo(cn, mongKok(cn));
    return;
  }
  // the gap recorded belongs to the frame drawn before it, so each one is filed under the part that frame was drawn in
  if (c.prev.name === 'fps' || c.prev.name === 'load') c.runs[c.prev.run][c.prev.name].push(real * 1000);
  // a part ends when its time is up; a load part also waits for at least 4 frames (for 6 seconds more at most)
  c.t += real;
  const part = CHECK[c.i];
  if (c.t >= part.t && !(part.name === 'load' && c.runs[part.run].load.length < 4 && c.t < part.t + 6)) {
    c.i++; c.t = 0;
    if (CHECK[c.i] && CHECK[c.i].run !== part.run) jumpTo(cn, mongKok(cn));   // each run drives through Mong Kok from its edge
  }
  const now = CHECK[c.i];
  if (!now) { finishCheck(g, cn); return; }
  c.prev = now;
  cn.picture.repeat = now.name === 'load' ? LOADN : 1;
  const st = cn.street, z = st.taxi.z;
  if (now.run === 1) {
    // a crash pop a few metres ahead, a new one each second (each lasts one), so one is always lit
    c.popT -= real;
    if (c.popT <= 0) { st.crash(z + 14, st.taxi.x); c.popT = 0.95; }
  } else if (now.run === 2) {
    // the pieces kept ahead of the taxi, all on screen at once
    if (!st.stop) {
      st.obstacles = CHECK_PIECES.obstacles.map(([kind, d, lane]) => ({ kind, z: z + d, x: st.lanes[lane], d }));
      st.animals = CHECK_PIECES.animals.map(([kind, d, x]) => ({ kind, z: z + d, x, d }));
      st.stop = { kind: 'pickup', z: z + CHECK_PIECES.stop, passenger: 'case', waiting: true };
    }
    for (const p of st.obstacles.concat(st.animals)) p.z = z + p.d;
    st.stop.z = z + CHECK_PIECES.stop;
  }
}
function stopCheck(g, cn, why) {
  g.check = null;
  cn.picture.repeat = 1;
  clearPieces(cn);
  if (why) g.result = [why, ''];
}
// a run's frame rate, the slowest 1 frame in 20, and the time to draw a frame; if the device kept up with the screen
// even while drawing each frame eight times over (sat false), the true time is shorter still
function score(run) {
  const tot = run.fps.reduce((a, b) => a + b, 0);
  return { avg: run.fps.length / (tot / 1000), slow: pct(run.fps, 0.95), cost: median(run.load) / LOADN, sat: median(run.load) > median(run.fps) * 1.3 };
}
function finishCheck(g, cn) {
  const c = g.check, p = cn.picture, all = c.runs.map(score), [a, b, d] = all;
  stopCheck(g, cn);
  const phone = all.every((r) => r.avg >= 29.5 && r.cost <= 25) ? 'pass' : 'below', computer = all.every((r) => r.avg >= 58) ? 'pass' : 'below';
  const ms = (r) => (r.sat ? 'about ' : 'under ') + '<b>' + fmt(r.cost, 1) + ' ms</b>';
  g.result = [
    '<b>' + fmt(a.avg) + ' fps</b> in Mong Kok, each frame drawn in ' + ms(a) + '; slowest 1 in 20 came ' + fmt(a.slow) + ' ms apart. With a crash pop lit: <b>' + fmt(b.avg) + ' fps</b>, ' + ms(b) +
      '. With street pieces: <b>' + fmt(d.avg) + ' fps</b>, ' + ms(d) + '.',
    'Phone target (30 fps, 25 ms): <b>' + phone + '</b> · Computer target (60 fps): <b>' + computer + '</b> · ' + popMade(p) + ' · ' + p.width + ' × ' + p.height + ', ' + (p.smoothing ? p.smoothing + '× smoothing' : 'no smoothing') + ' · ' + browserName() + ' · ' + (p.chip || 'unknown chip')
  ];
}
const popMade = (p) => 'crash pop words drawn in <b>' + fmt(p.pop.ms) + ' ms</b> (' + p.pop.width + ' × ' + p.pop.height + ' each)';

/* ----- the readout: scene and frame rate, what the scene shows, and the picture ----- */
function showReadout(g, cn) {
  if (!readout) return;
  const p = cn.picture, scene = SCENES[g.scene];
  const picName = { auto: 'Automatic', best: 'Best', faster: 'Faster', fastest: 'Fastest' };
  const pic = 'Picture: ' + picName[p.setting] + (p.setting === 'auto' ? (p.deciding ? ' (timing…)' : ' (' + picName[p.level] + ')') : '') +
    ' · ' + p.width + ' × ' + p.height + ', ' + (p.smoothing ? p.smoothing + '× smoothing' : 'no smoothing');
  let note = cn.touch ? NOTES[g.scene].replace('← → steer, ↓ brakes', 'Drag to steer').replace(', N jumps to the next district, hold F to drive fast', '').replace(' ↓ slows down.', '') : NOTES[g.scene], extra = pic;
  // the graphics memory and the opening times, in the scenes that drive the long street
  const mem = scene === 'Drive' || scene === 'Mong Kok' || scene === 'Long street' ? memLine(cn) : '';
  if (scene === 'Long street') {
    const t = g.tour, L = cn.street.length, z = ((cn.street.taxi.z % L) + L) % L, d = cn.street.district(z);
    note = 'Each district in turn from ' + TOUR_LEAD + ' m before its edge, ' + TOUR_TIME + ' s at 84 km/h with traffic. Now: ' + d.en + ', ' +
      fmt(z / 1000, 2) + ' km along the ' + fmt(L / 1000, 1) + ' km street.';
    extra = t.result || 'Timing every frame: the result shows after all four, in about a minute.';
  } else if (scene === 'Mong Kok') {
    const c = g.check, part = c && CHECK[c.i];
    if (g.result) { note = g.result[0]; extra = g.result[1] || pic; }
    else if (!part) note = 'Speed check: waiting for Automatic to finish timing the picture…';
    else {
      const timing = part.name === 'load' || (part.name === 'rest' && CHECK[c.i - 1].name === 'fps');
      note = 'Speed check' + RUN_NAMES[part.run] + ': ' + (timing ? 'timing a frame. The picture slows down on purpose.'
        : 'measuring every frame. Leave the page alone for about ' + (21 - part.run * 7) + ' seconds.');
    }
  } else if (scene === 'Street') {
    note += ' Passenger: ' + PASSENGERS[g.lay.lap % PASSENGERS.length][1] + '.';
  } else if (scene === 'Crash') {
    const next = POPS[g.crash.pop][1];
    note += ' Next: ' + next + (cn.touch ? (next.endsWith('!') ? '' : '.') : ' (C, S or B for a word, R for a random one).');
    extra = 'C' + popMade(p).slice(1) + '.';
  }
  const lines = ['<b>' + (g.scene + 1) + ' ' + scene + '</b> · ' + (p.fps ? Math.round(p.fps) : '…') + ' fps', note, extra, mem];
  const key = lines.join('|');
  if (key === g.shown) return;
  g.shown = key;
  lines.forEach((t, i) => { readout[i].innerHTML = t; });
}
</script>

</html>
