<!-- @dsCard group="Screens" height=720 width=1280 subtitle="Grunge City Rider's title screen, as approved in the screens round" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TitleScreen</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;width:1280px;height:720px;overflow:hidden}
.stage>img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.col{position:absolute;left:56px;top:52px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.tiles{position:absolute;right:24px;top:24px}
.hints{position:absolute;left:56px;bottom:24px}
</style>
</head>
<body>
<div class="stage">
  <img src="/_blob/021468c5262ea54acc813a22b783cfb6" alt="">
  <div class="cn-ui" style="position:absolute;inset:0">
    <div class="cn-title-shade"></div>
    <div class="col">
      <div class="cn-logo">
        <div class="cn-neon cn-vsign" aria-hidden="true"><span class="cn-tube is-teal"></span><span class="cn-lit-teal">夜</span><span class="cn-lit-teal">更</span><span class="cn-lit-teal">的</span><span class="cn-lit-teal">士</span></div>
        <div class="cn-neon cn-logo-board"><span class="cn-tube is-pink" aria-hidden="true"></span><h1 class="cn-logo-name cn-lit-pink"><span class="top">Grunge</span><span class="main">City Rider</span></h1></div>
      </div>
      <nav class="cn-neon cn-title-menu" aria-label="Main menu">
        <span class="cn-tube" aria-hidden="true"></span>
        <button class="cn-titem is-selected" type="button" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>Start game<span class="cn-kbd">Enter</span></button>
        <button class="cn-titem" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4"/><path d="M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4"/><path d="M8.5 20h7"/></svg>High scores</button>
        <button class="cn-titem" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
      </nav>
      <div class="cn-best">
        <div class="lab"><span class="zh" lang="zh-Hant">最佳</span><span class="en">BEST  HK$</span></div>
        <div data-cn-digits="386.40" data-h="30"></div>
        <span class="cn-sr">Best fare HK$386.40</span>
      </div>
    </div>
    <div class="cn-tiles tiles">
      <button class="cn-tile is-neon" type="button" aria-label="Sound on" aria-pressed="true"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></span></button>
      <button class="cn-tile is-neon" type="button" aria-label="Full screen" aria-pressed="false"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></span></button>
    </div>
    <div class="cn-plaque cn-keys hints">
      <span class="cn-kbd">←</span><span class="cn-kbd">→</span><span class="act">Steer</span>
      <span class="cn-kbd">↓</span><span class="act">Brake</span>
      <span class="cn-kbd">Esc</span><span class="act">Pause</span>
    </div>
  </div>
</div>
<script>CityNights.mountDigits();</script>
</body>
</html>
