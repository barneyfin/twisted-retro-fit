<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HighScores</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;width:960px;height:540px;overflow:hidden}
.stage>img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cn-face{gap:12px}
</style>
</head>
<body>
<div class="stage">

            <caption class="cn-sr">Top ten fares, newest lit</caption>

              <tr><td class="rank">2</td><td class="who">KIT</td><td class="fare"><span class="cn-sr">HK$386.40</span><div data-cn-digits="386.40" data-h="18"></div></td></tr>

              <tr><td class="rank">5</td><td class="who">LAU</td><td class="fare"><span class="cn-sr">HK$298.50</span><div data-cn-digits="298.50" data-h="18"></div></td></tr>
              <tr><td class="rank">6</td><td class="who">TAM</td><td class="fare"><span class="cn-sr">HK$276.10</span><div data-cn-digits="276.10" data-h="18"></div></td></tr>
              <tr><td class="rank">7</td><td class="who">CHU</td><td class="fare"><span class="cn-sr">HK$241.70</span><div data-cn-digits="241.70" data-h="18"></div></td></tr>
              <tr><td class="rank">8</td><td class="who">YIP</td><td class="fare"><span class="cn-sr">HK$219.30</span><div data-cn-digits="219.30" data-h="18"></div></td></tr>
              <tr><td class="rank">9</td><td class="who">SZE</td><td class="fare"><span class="cn-sr">HK$188.60</span><div data-cn-digits="188.60" data-h="18"></div></td></tr>
              <tr><td class="rank">10</td><td class="who">HO.</td><td class="fare"><span class="cn-sr">HK$152.00</span><div data-cn-digits="152.00" data-h="18"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="cn-btns"><button class="cn-btn is-primary" type="button">Play again<span class="cn-kbd">Enter</span></button><button class="cn-btn" type="button" style="width:120px">Menu</button></div>
      </div>
    </div>
  </div>
</div>
<script>CityNights.mountDigits();</script>
</body>
</html>
