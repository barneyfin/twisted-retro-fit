<!-- @dsCard group="Screens" height=540 width=960 subtitle="A new best: the badge, Previous best, and Continue to the initials" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GameOverCard</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;width:960px;height:540px;overflow:hidden}
.stage>img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.best{display:flex;gap:10px;align-items:baseline}
</style>
</head>
<body>
<div class="stage">
  <img src="/_blob/0e50e8888a463c1175004694b5ad4c8b" alt="">
  <div class="cn-ui wrap">
    <div class="cn-scrim"></div>
    <div class="cn-lightbox" role="dialog" aria-modal="true" aria-labelledby="go-title" style="position:relative;width:420px">
      <div class="cn-face">
        <h2 class="cn-header" id="go-title"><span class="zh" lang="zh-Hant">遊戲結束</span><span class="en">Game over</span></h2>
        <div class="cn-badge"><span class="zh" lang="zh-Hant">新紀錄</span><span class="en">New best</span></div>
        <div class="cn-inset">
          <div class="cn-inset-label"><span class="zh" lang="zh-Hant">車資</span><span class="en">FARE  HK$</span></div>
          <div data-cn-digits="412.80" data-h="64" style="justify-content:flex-end"></div>
          <span class="cn-sr">Final fare HK$412.80</span>
        </div>
        <div class="best"><span class="cn-label">Previous best</span><span class="cn-value">HK$386.40</span></div>
        <button class="cn-btn is-primary" type="button">Continue<span class="cn-kbd">Enter</span></button>
      </div>
    </div>
  </div>
</div>
<script>CityNights.mountDigits();</script>
</body>
</html>
