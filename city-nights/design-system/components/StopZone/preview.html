<!-- @dsCard group="World" height=1056 width=960 subtitle="One bay, two colours: bold paint, a low lit sign at its start and three lit posts along its far half; drawn live, in the bay with its ring, and on a phone" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>preview</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;width:960px;overflow:hidden;background:var(--night-black)}
.stage img,.stage canvas{position:absolute;display:block}
.tag{position:absolute;padding:5px 10px;border-radius:6px;background:var(--plaque);box-shadow:0 0 0 1px var(--meter-rule);color:var(--night-text);font:600 13px/18px var(--font-ui);white-space:nowrap}
.zh{font-family:var(--font-zh-sans);font-weight:700}

</style>
</head>
<body>
<div class="stage" style="height:1056px">
  <img src="/_blob/b9ce6116954746f8b4350447d3e7c0a5" alt="On the street: the teal pick-up bay in the left-hand lane, its 上客 PICK-UP sign at the start and three lit posts along the far half, a passenger with a suitcase waiting" style="left:0px;top:0px;width:480px;height:270px">
  <img src="/_blob/6626581b38ba323def13e5b00e711975" alt="On the street: the pink drop-off bay in the left-hand lane, its 落客 DROP-OFF sign at the start and three lit posts along the far half" style="left:480px;top:0px;width:480px;height:270px">
  <canvas id="c1" style="left:0;top:270px;width:480px;height:300px"></canvas>
  <canvas id="c2" style="left:480px;top:270px;width:480px;height:300px"></canvas>
  <span class="tag" style="left:10px;top:10px">On the street</span>
  <span class="tag" style="left:10px;top:280px">Pick-up · tube-teal · <span class="zh">上客</span> PICK-UP</span>
  <span class="tag" style="left:490px;top:280px">Drop-off · tube-pink · <span class="zh">落客</span> DROP-OFF</span>
  <img src="/_blob/d0e6debff986d99127a181b05a4a9332" alt="The taxi three-quarters inside the teal pick-up bay, the bay's teal ring of light on the road round it" style="left:0;top:570px;width:480px;height:270px">
  <img src="/_blob/f6bb946992844989d37d457adc53b6a0" alt="The taxi braking inside the pink drop-off bay, the bay's pink ring round it, the sign beside it on the left" style="left:480px;top:570px;width:480px;height:270px">
  <span class="tag" style="left:10px;top:580px">In the bay: its ring (<code>CityNights.hud.bayRing</code>)</span>
  <span class="tag" style="left:490px;top:580px">The taxi hides the paint; the sign and posts still show</span>
  <img src="/_blob/1e7e46615ecb1f8a26e11262589a1bf6" alt="On a phone: the teal pick-up bay 12 m ahead under a street lamp, its sign readable, the passenger waving" style="left:0;top:840px;width:480px;height:216px">
  <img src="/_blob/192548154a2690a90312c083d385336c" alt="On a phone: the taxi in the bay's lane 20 m short of the pink drop-off bay; the sign and posts show over its roof" style="left:480px;top:840px;width:480px;height:216px">
  <span class="tag" style="left:10px;top:850px">On a phone, 12 m ahead, under a lamp</span>
  <span class="tag" style="left:490px;top:850px">In the bay's lane, 20 m short: over the roof</span>
</div>
<script>
(function () {
  var S = window.CityNights.street;
  // the game's camera, simplified to a straight road: d metres ahead of the taxi's rear bumper, x across from the road's centre, y up
  function cam(w, h, camX, zoom) {
    zoom = zoom || 1; var K = w / 2 * zoom, D = 1 / Math.tan(50 * Math.PI / 180), HZ = h * (0.4 - 0.22 * (zoom - 1)), CH = 2.375, CAB = 3.54;
    return function (d, x, y) { var z = d + CAB; if (z < 0.4) return null; var sc = D / z; return { x: w / 2 + sc * (x - (camX || 0)) * K, y: HZ + sc * (CH - (y || 0)) * K, s: sc * K }; };
  }
  function tok(n) { return getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim(); }
  // a plain stretch of the street for the drawings to stand on: road, pavements, lane lines, a lamp's warm pool
  function street(g, w, h, pt) {
    var hz = pt(400, 0, 0).y, sky = g.createLinearGradient(0, 0, 0, hz); sky.addColorStop(0, tok('sky-top')); sky.addColorStop(1, tok('sky-low')); g.fillStyle = sky; g.fillRect(0, 0, w, h);
    var q = function (d0, d1, x0, x1, fill) { var a = pt(d1, x0, 0), b = pt(d1, x1, 0), c = pt(d0, x1, 0), e = pt(d0, x0, 0); if (!a || !c) return; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.lineTo(c.x, c.y); g.lineTo(e.x, e.y); g.closePath(); g.fillStyle = fill; g.fill(); };
    var rg = g.createLinearGradient(0, hz, 0, h); rg.addColorStop(0, tok('road-far')); rg.addColorStop(1, tok('road-near'));
    var pg = g.createLinearGradient(0, hz, 0, h); pg.addColorStop(0, tok('pave-far')); pg.addColorStop(1, tok('kerb-brown'));
    q(-3, 80, -9, -5, pg); q(-3, 80, 5, 9, pg); q(-3, 80, -5, 5, rg);
    q(-3, 80, -5.05, -4.95, tok('kerb')); q(-3, 80, 4.95, 5.05, tok('kerb'));
    q(-3, 80, -4.8, -4.7, tok('lane-yellow')); q(-3, 80, -4.6, -4.5, tok('lane-yellow')); q(-3, 80, 4.5, 4.6, tok('lane-yellow')); q(-3, 80, 4.7, 4.8, tok('lane-yellow'));
    for (var d = -3; d < 80; d += 9) { q(d, d + 4.5, -1.74, -1.6, tok('lane-white')); q(d, d + 4.5, 1.6, 1.74, tok('lane-white')); }
    var lp = g.createRadialGradient(w / 2, h * 0.62, 0, w / 2, h * 0.62, w * 0.6); lp.addColorStop(0, 'rgba(255,184,77,0.16)'); lp.addColorStop(1, 'rgba(255,184,77,0)');
    g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = lp; g.fillRect(0, hz, w, h - hz); g.restore();
  }
  function canvasFor(id, w, h) { var c = document.getElementById(id), dpr = Math.min(window.devicePixelRatio || 1, 2); c.width = w * dpr; c.height = h * dpr; var g = c.getContext('2d'); g.scale(dpr, dpr); return g; }
  // a pt that also scales for the canvas's pixel ratio is not needed: the context is scaled, s is in CSS pixels
  var fontsReady = Promise.all([document.fonts.load('900 40px "Noto Serif TC"', '道路工程易碎'), document.fonts.load('700 40px "Noto Sans TC"', '上客落'), document.fonts.load('700 40px Antonio')]);
  fontsReady.then(draw, draw);
  function draw() {
    [['c1', 'pickup'], ['c2', 'dropoff']].forEach(function (a) {
      var g = canvasFor(a[0], 480, 300), pt = cam(480, 300, -1.2, 1.35); street(g, 480, 300, pt);
      var b = S.bay(a[1]); S.drawBay(g, pt, b, 4, 14, -4.85, -1.85);
      S.bayStands(b, 4, -4.85).forEach(function (it) { S.stand(g, pt, it.spr, it.d, it.x); });   // far to near: the posts, then the sign
    });
  }
})();
</script>
</body>
</html>
