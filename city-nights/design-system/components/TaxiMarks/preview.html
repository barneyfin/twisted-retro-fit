<!-- @dsCard group="Play" height=810 width=960 subtitle="What the taxi carries: 快 with its time left, 保 with its ring, the fare boost; the roof sign out while hired; in a bay, the bay's ring instead of 保's" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TaxiMarks</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;overflow:hidden;background:var(--night-black)}
.stage img,.stage canvas{position:absolute;display:block}
.tag{position:absolute;padding:5px 10px;border-radius:6px;background:var(--plaque);box-shadow:0 0 0 1px var(--meter-rule);color:var(--night-text);font:600 13px/18px var(--font-ui);white-space:nowrap}
.zh{font-family:var(--font-zh-sans);font-weight:700}
</style>
</head>
<body>
<div class="stage" style="width:960px;height:810px">
  <img src="/_blob/5cd6fb916eaa11262343c8c122f8ccfb" alt="Mid-fare in Mong Kok, the taxi in the middle lane" style="left:0;top:0;width:960px;height:540px">
  <img src="/_blob/543158efeeea9bbfada604101d1569aa" alt="The taxi three-quarters inside the teal pick-up bay, a teal ring of light round it" style="left:0;top:540px;width:480px;height:270px">
  <img src="/_blob/81eea484599ba0d10ede32d1197a363e" alt="The taxi braking inside the pink drop-off bay, a pink ring of light round it" style="left:480px;top:540px;width:480px;height:270px">
  <canvas id="c" style="left:0;top:0;width:960px;height:540px"></canvas>
  <span class="tag" style="left:10px;top:10px"><span class="zh">快</span> 6 s left · <span class="zh">保</span> held · <span class="zh">雙</span> on · the roof sign out while hired</span>
  <span class="tag" style="left:10px;top:550px">Pick-up bay: its ring, <span class="zh">保</span>'s steps aside</span>
  <span class="tag" style="left:490px;top:550px">Drop-off bay</span>
</div>
<script>
(function () {
  function cv(id, w, h) { var c = document.getElementById(id), r = window.devicePixelRatio || 1; c.width = Math.round(w * r); c.height = Math.round(h * r); return { g: c.getContext('2d'), r: r }; }
  function ready(fn) { Promise.all(['700 20px "Noto Sans TC"', '900 20px "Noto Serif TC"', '62px Bangers', '700 20px Antonio', '600 20px "IBM Plex Sans Condensed"', '500 20px "IBM Plex Sans Condensed"'].map(function (f) { return document.fonts.load(f); })).then(fn, fn); }
  ready(function () {
    var C = cv('c', 960, 540), g = C.g, r = C.r, H = CityNights.hud, k = 0.75 * r;
    var x = 480 * r, y = 486 * r, s = 114 * r;   // the taxi's rear on the road, and pixels per metre there (street picture 960 x 540)
    // the roof sign out: the kit draws the taxi; here the sign's face is darkened as the kit does it
    g.fillStyle = 'rgba(28, 22, 16, 0.86)'; g.beginPath(); g.roundRect(461 * r, 261 * r, 38 * r, 18.4 * r, 2 * r); g.fill();
    H.shieldRing(g, x, y, s);
    H.badges(g, x, y, k, k, [{ kind: 'speed', left: 0.6 }, { kind: 'shield' }, { kind: 'double' }]);
  });
})();
</script>
</body>
</html>
