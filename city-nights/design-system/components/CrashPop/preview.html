<!-- @dsCard group="World" height=800 width=960 subtitle="The smoke cloud over the crash in Mong Kok; the three words; Replay plays the next pop" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CrashPop</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;width:960px;height:800px;overflow:hidden;background:var(--night-black)}
.street{position:absolute;left:0;top:0;width:960px;height:540px;object-fit:cover}
#hero{left:75px;top:45px;width:810px;height:525px}
.row{position:absolute;left:0;top:560px;width:960px;display:flex;justify-content:center;gap:24px}
.cell{width:292px;text-align:center}
.cell canvas{display:block;width:292px;height:189px}
.cell b{display:block;margin-top:6px;font:600 15px/20px var(--font-ui);color:var(--night-text)}
.cell span{display:block;font:500 13px/18px var(--font-ui);color:var(--neon-unlit)}
.replay{position:absolute;right:16px;top:16px;height:var(--tap-min);padding:0 16px;border:none;border-radius:6px;background:var(--plaque);color:var(--night-text);font:600 15px/20px var(--font-ui);box-shadow:0 0 0 1px var(--meter-rule);cursor:pointer}
</style>
</head>
<body>
<div class="stage cn-ui">
  <img class="street" src="/_blob/0e50e8888a463c1175004694b5ad4c8b" alt="The taxi running into the back of a van in Mong Kok">
  <canvas class="cn-pop" id="hero" aria-label="CRASH! lit on a cloud of smoke over the crash"></canvas>
  <button class="replay" id="replay" type="button">Replay</button>
  <div class="row">
    <div class="cell"><canvas data-word="crash" aria-label="CRASH!"></canvas><b>CRASH! 轟</b><span>Parts fly off</span></div>
    <div class="cell"><canvas data-word="smash" aria-label="SMASH!"></canvas><b>SMASH! 啪</b><span>Glass breaks</span></div>
    <div class="cell"><canvas data-word="bang" aria-label="BANG!"></canvas><b>BANG! 砰</b><span>Something bursts</span></div>
  </div>
</div>
<script>
(function () {
  var CN = window.CityNights, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var labels = { crash: 'CRASH!', smash: 'SMASH!', bang: 'BANG!' };
  // draw(canvas, word): the pop filling its canvas (box 1080 x 700 at 720 lines)
  function draw(c, word) {
    var w = c.clientWidth, h = c.clientHeight;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    var g = c.getContext('2d'), s = (w * dpr) / CN.crashPop.box[2];
    g.clearRect(0, 0, c.width, c.height);
    CN.drawCrashPop(g, word, c.width / 2, c.height / 2, s);
  }
  var hero = document.getElementById('hero'), order = ['crash', 'smash', 'bang'], last = 'crash';
  function start() {
    draw(hero, 'crash');
    document.querySelectorAll('.cell canvas').forEach(function (c) { draw(c, c.getAttribute('data-word')); });
  }
  document.getElementById('replay').addEventListener('click', function () {
    // the kit's rule: a random word, never the same twice running
    var pick = order.filter(function (w) { return w !== last; })[Math.floor(Math.random() * 2)];
    last = pick; draw(hero, pick); hero.setAttribute('aria-label', labels[pick] + ' lit on a cloud of smoke over the crash');
    hero.classList.remove('is-playing'); void hero.offsetWidth; hero.classList.add('is-playing');
  });
  // in the game the pop is gone after its second; here it comes back so the card always shows it
  hero.addEventListener('animationend', function () { hero.classList.remove('is-playing'); });
  Promise.all([document.fonts.load('400 100px Bangers'), document.fonts.load('700 38px "Noto Sans TC"', '轟啪砰')]).then(start, start);
})();
</script>
</body>
</html>
