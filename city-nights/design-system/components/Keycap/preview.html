<!-- @dsCard group="Lightbox" height=170 width=640 subtitle="On the dark plaque over the street; on the lightbox face" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keycap</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;width:640px;height:170px;overflow:hidden}
.stage img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:18px;padding-left:40px}
</style>
</head>
<body>
<div class="stage">
  <img src="/_blob/021468c5262ea54acc813a22b783cfb6" alt="">
  <div class="col">
    <div class="cn-ui cn-plaque cn-keys">
      <span class="cn-kbd">←</span><span class="cn-kbd">→</span><span class="act">Steer</span>
      <span class="cn-kbd">↓</span><span class="act">Brake</span>
      <span class="cn-kbd">Esc</span><span class="act">Pause</span>
    </div>
    <div class="cn-ui cn-lightbox">
      <div class="cn-face" style="padding:10px 16px">
        <div class="cn-keys">
          <span class="cn-kbd">↑</span><span class="cn-kbd">↓</span><span class="act">Letter</span>
          <span class="cn-kbd">←</span><span class="cn-kbd">→</span><span class="act">Move</span>
          <span class="cn-kbd">Enter</span><span class="act">Save</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
