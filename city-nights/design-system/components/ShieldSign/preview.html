<!-- @dsCard group="World" height=540 width=960 subtitle="The shielded hit: 保 takes a crash, and the car is cleared away under the sign" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShieldSign</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;overflow:hidden;background:var(--night-black)}
.stage img,.stage canvas{position:absolute;display:block}
.tag{position:absolute;padding:5px 10px;border-radius:6px;background:var(--plaque);box-shadow:0 0 0 1px var(--meter-rule);color:var(--night-text);font:600 13px/18px var(--font-ui);white-space:nowrap}
.zh{font-family:var(--font-zh-sans);font-weight:700}
</style>
</head>
<body>
<div class="stage" style="width:960px;height:540px">
  <img src="/_blob/e6d359be72eb1c56e6c98b71eee7f8b9" alt="The taxi reaching a car in its own lane; the car is mostly hidden behind the taxi" style="left:0;top:0;width:960px;height:540px">
  <canvas id="c" style="left:0;top:0;width:960px;height:540px"></canvas>
  <span class="tag" style="left:10px;top:10px">Over the point of contact, for <code>pop-time</code> · no freeze, no life or tip lost</span>
</div>
<script>
(function () {
  function cv(id, w, h) { var c = document.getElementById(id), r = window.devicePixelRatio || 1; c.width = Math.round(w * r); c.height = Math.round(h * r); return { g: c.getContext('2d'), r: r }; }
  function ready(fn) { Promise.all(['700 20px "Noto Sans TC"', '900 20px "Noto Serif TC"', '62px Bangers', '700 20px Antonio', '600 20px "IBM Plex Sans Condensed"', '500 20px "IBM Plex Sans Condensed"'].map(function (f) { return document.fonts.load(f); })).then(fn, fn); }
  ready(function () {
    var C = cv('c', 960, 540), g = C.g, r = C.r;
    CityNights.hud.shieldSign(g, 480 * r, (486 - 2.55 * 114) * r, 0.75 * r, 1, 1);
  });
})();
</script>
</body>
</html>
