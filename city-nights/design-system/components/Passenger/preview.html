<!-- @dsCard group="World" height=1040 width=960 subtitle="On the street beside the pick-up bay, the three kinds and two poses drawn live, each in its pool of light; then getting in" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>preview</title>
<style>
body{margin:0;background:var(--night-black)}
.stage{position:relative;width:960px;overflow:hidden;background:var(--night-black)}
.stage img,.stage canvas{position:absolute;display:block}
.tag{position:absolute;padding:5px 10px;border-radius:6px;background:var(--plaque);box-shadow:0 0 0 1px var(--meter-rule);color:var(--night-text);font:600 13px/18px var(--font-ui);white-space:nowrap}
.zh{font-family:var(--font-zh-sans);font-weight:700}

</style>
</head>
<body>
<div class="stage" style="height:1040px">
  <img src="/_blob/ed15cb20b576926117f1f9c15f642c22" alt="On the street: a passenger with a suitcase waving from the left-hand pavement, standing in a warm pool of light beside the teal pick-up bay" style="left:0px;top:0px;width:960px;height:540px">
  <canvas id="c" style="left:0;top:540px;width:960px;height:300px"></canvas>
  <span class="tag" style="left:10px;top:10px">On the street</span>
  <span class="tag" style="left:10px;top:550px">Drawn live: every passenger stands in a warm pool of light</span>
  <span class="tag" style="left:95px;top:806px">Hailing</span>
  <span class="tag" style="left:325px;top:806px">Waving</span>
  <span class="tag" style="left:540px;top:806px">With a suitcase</span>
  <span class="tag" style="left:770px;top:806px">With shopping</span>
  <img src="/_blob/faa672b38f58a1d7e255d015e12540aa" alt="The stop counts, the taxi still rolling past the waving passenger" style="left:0;top:840px;width:320px;height:180px">
  <img src="/_blob/571acfe8a49c021f49a1b52b807c8161" alt="The passenger fading out as the taxi takes them" style="left:320px;top:840px;width:320px;height:180px">
  <img src="/_blob/340518c2148990d875abafc16d080a62" alt="The taxi pulling away, its roof sign out" style="left:640px;top:840px;width:320px;height:180px">
  <canvas id="gi" style="left:0;top:840px;width:960px;height:180px"></canvas>
  <span class="tag" style="left:10px;top:850px">Getting in: the stop counts</span>
  <span class="tag" style="left:330px;top:850px">The passenger fades</span>
  <span class="tag" style="left:650px;top:850px">The roof sign out while hired</span>
</div>
<script>
(function () {
  var S = window.CityNights.street;
  // the game's camera, simplified to a straight road: d metres ahead of the taxi's rear bumper, x across from the road's centre, y up
  function cam(w, h, camX) {
    var K = w / 2, D = 1 / Math.tan(50 * Math.PI / 180), HZ = h * 0.4, CH = 2.375, CAB = 3.54;
    return function (d, x, y) { var z = d + CAB; if (z < 0.4) return null; var sc = D / z; return { x: w / 2 + sc * (x - (camX || 0)) * K, y: HZ + sc * (CH - (y || 0)) * K, s: sc * K }; };
  }
  function tok(n) { return getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim(); }
  // a plain stretch of the street for the drawings to stand on: road, pavements, lane lines, a lamp's warm pool
  function street(g, w, h, pt) {
    var sky = g.createLinearGradient(0, 0, 0, h * 0.4); sky.addColorStop(0, tok('sky-top')); sky.addColorStop(1, tok('sky-low')); g.fillStyle = sky; g.fillRect(0, 0, w, h);
    var q = function (d0, d1, x0, x1, fill) { var a = pt(d1, x0, 0), b = pt(d1, x1, 0), c = pt(d0, x1, 0), e = pt(d0, x0, 0); if (!a || !c) return; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.lineTo(c.x, c.y); g.lineTo(e.x, e.y); g.closePath(); g.fillStyle = fill; g.fill(); };
    var rg = g.createLinearGradient(0, h * 0.4, 0, h); rg.addColorStop(0, tok('road-far')); rg.addColorStop(1, tok('road-near'));
    var pg = g.createLinearGradient(0, h * 0.4, 0, h); pg.addColorStop(0, tok('pave-far')); pg.addColorStop(1, tok('kerb-brown'));
    q(-3, 80, -9, -5, pg); q(-3, 80, 5, 9, pg); q(-3, 80, -5, 5, rg);
    q(-3, 80, -5.05, -4.95, tok('kerb')); q(-3, 80, 4.95, 5.05, tok('kerb'));
    q(-3, 80, -4.8, -4.7, tok('lane-yellow')); q(-3, 80, -4.6, -4.5, tok('lane-yellow')); q(-3, 80, 4.5, 4.6, tok('lane-yellow')); q(-3, 80, 4.7, 4.8, tok('lane-yellow'));
    for (var d = -3; d < 80; d += 9) { q(d, d + 4.5, -1.74, -1.6, tok('lane-white')); q(d, d + 4.5, 1.6, 1.74, tok('lane-white')); }
    var lp = g.createRadialGradient(w / 2, h * 0.62, 0, w / 2, h * 0.62, w * 0.6); lp.addColorStop(0, 'rgba(255,184,77,0.16)'); lp.addColorStop(1, 'rgba(255,184,77,0)');
    g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = lp; g.fillRect(0, h * 0.4, w, h * 0.6); g.restore();
  }
  function canvasFor(id, w, h) { var c = document.getElementById(id), dpr = Math.min(window.devicePixelRatio || 1, 2); c.width = w * dpr; c.height = h * dpr; var g = c.getContext('2d'); g.scale(dpr, dpr); return g; }
  // a pt that also scales for the canvas's pixel ratio is not needed: the context is scaled, s is in CSS pixels
  var fontsReady = Promise.all([document.fonts.load('900 40px "Noto Serif TC"', '道路工程易碎'), document.fonts.load('700 40px "Noto Sans TC"', '上客落'), document.fonts.load('700 40px Antonio')]);
  draw();
  function draw() {
    var g = canvasFor('c', 960, 300), xs = [130, 360, 600, 830], y = 255, pool = S.pool();
    var bg = g.createLinearGradient(0, 0, 0, 300); bg.addColorStop(0, tok('night-black')); bg.addColorStop(1, tok('kerb-brown')); g.fillStyle = bg; g.fillRect(0, 0, 960, 300);
    [['plain', 0], ['plain', 1], ['case', 1], ['bags', 0]].forEach(function (p, i) {
      g.save(); g.globalCompositeOperation = 'lighter'; g.drawImage(pool, xs[i] - 110, y - 26, 220, 52); g.restore();
      var s = S.passenger(p[0], p[1]), k = 0.78;
      g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(xs[i], y + 2, 30, 6, 0, 0, Math.PI * 2); g.fill();
      g.drawImage(s.c, xs[i] - s.ax * k, y - s.ay * k, s.c.width * k, s.c.height * k);
    });
  }
})();
  // getting in: the roof sign goes out (the kit bakes it into the taxi; here its face is darkened as the kit does it)
  (function () { var c = document.getElementById('gi'), r = window.devicePixelRatio || 1; c.width = 960 * r; c.height = 180 * r; var g = c.getContext('2d'), k = 320 / 960 * r;
    g.fillStyle = 'rgba(28, 22, 16, 0.5)'; g.beginPath(); g.roundRect(320 * r + 460.5 * k, 261.5 * k, 39 * k, 19.4 * k, 2 * k); g.fill();
    g.fillStyle = 'rgba(28, 22, 16, 0.86)'; g.beginPath(); g.roundRect(640 * r + 460.5 * k, 261.5 * k, 39 * k, 19.4 * k, 2 * k); g.fill(); })();
</script>
</body>
</html>
