# Publishes Twisted Retro Fit, the arcade website, to GitHub Pages each time main is pushed.
# GitHub builds the site the same way you do on your computer (python site/build.py) and publishes _site/.
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish the arcade

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab, to publish again by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the games and the site
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
